  // sub-boxes must each contain 1..N at most once. A cubie that violates any
  // constraint on any of its faces is flagged; non-given conflicts paint red.
  function validate() {
    const conflicts = new Set();
    for (const f of FACE_DIRS) {
      const axis = f.axis;
      const fixed = f.sign > 0 ? N - 1 : 0;
      const cells = [];
      for (let u = 0; u < N; u++) for (let v = 0; v < N; v++) {
        let i, j, k;
        if      (axis === 'x') { i = fixed; j = u;     k = v; }
        else if (axis === 'y') { i = u;     j = fixed; k = v; }
        else                   { i = u;     j = v;     k = fixed; }
        const cube = grid[i][j][k];
        if (cube) cells.push({ u, v, cube, value: cube.userData.value });
      }
      const flag = arr => {
        const seen = new Map();
        for (const c of arr) {
          if (c.value === 0) continue;
          if (!seen.has(c.value)) seen.set(c.value, []);
          seen.get(c.value).push(c);
        }
        for (const list of seen.values()) {
          if (list.length > 1) for (const c of list) conflicts.add(c.cube);
        }
      };
      for (let u = 0; u < N; u++) flag(cells.filter(c => c.u === u));
      for (let v = 0; v < N; v++) flag(cells.filter(c => c.v === v));
      for (let bu = 0; bu < blockSize; bu++)
        for (let bv = 0; bv < blockSize; bv++)
          flag(cells.filter(c => Math.floor(c.u / blockSize) === bu && Math.floor(c.v / blockSize) === bv));
    }
    for (const c of allCubes) {
      const shouldFlag = !c.userData.isGiven && c.userData.value !== 0 && conflicts.has(c);
      if (!!c.userData.isConflict !== shouldFlag) {
        c.userData.isConflict = shouldFlag;
        rebuildCubePlanes(c);
      }
    }
  }

  function flip(axis, dir) {
    const snap = v => Math.round(v / (Math.PI/2)) * (Math.PI/2);
    if (axis === 'x') targetRotX = snap(targetRotX) + dir * Math.PI/2;
    else              targetRotY = snap(targetRotY) + dir * Math.PI/2;
  }

  const _tmpQuat = new THREE.Quaternion();
  const _tmpEuler = new THREE.Euler();
  function arrowMove(sx, sy, sz) {
    if (!selectedCube) return;
    _tmpEuler.set(targetRotX, targetRotY, 0, 'XYZ');
    _tmpQuat.setFromEuler(_tmpEuler).invert();
    const localDir = new THREE.Vector3(sx, sy, sz).applyQuaternion(_tmpQuat);
    const ax = Math.abs(localDir.x), ay = Math.abs(localDir.y), az = Math.abs(localDir.z);
    let di = 0, dj = 0, dk = 0;
    if (ax >= ay && ax >= az)      di = Math.sign(localDir.x);
    else if (ay >= az)             dj = Math.sign(localDir.y);
    else                           dk = Math.sign(localDir.z);
    moveSelected(di, dj, dk);
  }
  function moveSelected(di, dj, dk) {
    if (!selectedCube || (di === 0 && dj === 0 && dk === 0)) return;
    // Walk the shell from the current cubie in (di,dj,dk) until we land on
    // another shell cubie (skip the hollow interior). Stop at bounds.
    let { i, j, k } = selectedCube.userData;
    while (true) {
      i += di; j += dj; k += dk;
      if (i < 0 || i >= N || j < 0 || j >= N || k < 0 || k >= N) return;
      const next = grid[i][j][k];
      if (next) { api.pick({ object: next }); return; }
    }
  }

  const totalCells = N * N * N - Math.max(0, (N - 2)) ** 3;
  const api = {
    name: N === 9 ? 'Sudoku Cube' : `Sudoku Cube ${N}×${N}×${N}`,
    subtitle: `A ${totalCells}-cell puzzle living in three dimensions (shell only). Digits 1–${N}.`,
    controlsHTML:
      `<kbd>left-click</kbd> select &nbsp; <kbd>1</kbd>–<kbd>${N}</kbd> fill &nbsp; <kbd>0</kbd>/<kbd>⌫</kbd> clear<br>` +
      `<kbd>right-drag</kbd> rotate &nbsp; <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> flip face<br>` +
      `<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> move &nbsp; <kbd>⇧</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> Z-axis &nbsp; <kbd>scroll</kbd> zoom`,
    cameraDistance: DEFAULT_ZOOM,
    drivesCamera: true, // cube manages its own zoom

    install() {
      build();
      validate();
      scene.add(group);
    },
    uninstall() {
      if (selectedCube) {
        selectedCube.material.emissive && selectedCube.material.emissive.setHex(0x000000);
        selectedCube = null;
      }
      scene.remove(group);
      disposeGroup(group);
      group = null;
      allCubes = [];
      grid = null;
    },
    get pickables() { return allCubes; },
    pick(hit) {
      if (selectedCube && selectedCube.material.emissive) {
        selectedCube.material.emissive.setHex(0x000000);
        selectedCube.material.emissiveIntensity = 1;
      }
      selectedCube = hit ? hit.object : null;
      if (selectedCube) {
        selectedCube.material.emissive = new THREE.Color(0xffd166);
        selectedCube.material.emissiveIntensity = 0.2;
        highlightInner.visible = true;
        highlightOuter.visible = true;
      } else {
        highlightInner.visible = false;
        highlightOuter.visible = false;
      }
      refreshSelected();
    },
    clearPick() { this.pick(null); },
    selectedInfoHTML() {
      if (!selectedCube) return 'No cube selected';
      const { i, j, k, isGiven, value } = selectedCube.userData;
      const block = `(${Math.floor(i/3)+1}, ${Math.floor(j/3)+1}, ${Math.floor(k/3)+1})`;
      let v;
      if (value === 0)        v = '<span class="dim">empty</span>';
      else if (isGiven)       v = `<span class="given">${value}</span> <span class="dim">(given)</span>`;
      else                    v = `<span class="user">${value}</span>`;
      return `<b>Selected cell</b> <span class="pill cell">Cell</span><br>` +
             `<span class="dim">Cell</span> (${i+1}, ${j+1}, ${k+1})<br>` +
             `<span class="dim">Sub-block</span> ${block}<br>` +
             `<span class="dim">Value</span> ${v}`;
    },
    statsHTML() {
      const subBlocks = blockSize * blockSize * blockSize;
      return `<span class="dim">cells</span> <span class="stat-num">${allCubes ? allCubes.length : 0}</span><br>` +
             `<span class="dim">sub-blocks</span> <span class="stat-num">${subBlocks}</span><br>` +
             `<span class="dim">given clues</span> <span class="stat-num">${givenCount}</span><br>` +
             `<span class="dim">your entries</span> <span class="stat-num">${userEntries}</span>`;
    },
    // Cube uses its own rotation/zoom so it can flip-snap with WASD.
    handleDrag(dx, dy) {
      rotY += dx * 0.006; rotX += dy * 0.006;
      targetRotX = rotX; targetRotY = rotY;
    },
    handleWheel(deltaY) {
      zoom = Math.max(10, Math.min(70, zoom + deltaY * 0.02));
    },
    keydown(e) {
      const k = e.key;
      if (k === 'w' || k === 'W') { flip('x', -1); e.preventDefault(); return true; }
      if (k === 's' || k === 'S') { flip('x',  1); e.preventDefault(); return true; }
      if (k === 'a' || k === 'A') { flip('y', -1); e.preventDefault(); return true; }
      if (k === 'd' || k === 'D') { flip('y',  1); e.preventDefault(); return true; }
      if (k === 'ArrowUp')    { e.shiftKey ? arrowMove(0,0,-1) : arrowMove(0, 1,0); e.preventDefault(); return true; }
      if (k === 'ArrowDown')  { e.shiftKey ? arrowMove(0,0, 1) : arrowMove(0,-1,0); e.preventDefault(); return true; }
      if (k === 'ArrowLeft')  { arrowMove(-1,0,0); e.preventDefault(); return true; }
      if (k === 'ArrowRight') { arrowMove( 1,0,0); e.preventDefault(); return true; }
      if (k >= '1' && k <= '9') {
        const v = parseInt(k);
        if (v <= N) setCellValue(selectedCube, v);
        e.preventDefault();
        return true;
      }
      if (k === '0' || k === 'Backspace' || k === 'Delete') { setCellValue(selectedCube, 0); e.preventDefault(); return true; }
      return false;
    },
    frame(dt, t) {
      _t = t;
      rotX += (targetRotX - rotX) * 0.18;
      rotY += (targetRotY - rotY) * 0.18;
      group.rotation.x = rotX;
      group.rotation.y = rotY;
      for (const c of allCubes) c.position.lerp(c.userData.targetPos, 0.2);
      if (selectedCube) {
        highlightInner.position.copy(selectedCube.position);
        highlightOuter.position.copy(selectedCube.position);
        highlightOuter.material.opacity = 0.25 + 0.15 * Math.sin(_t * 3);
      }
      camera.position.set(0, 0, zoom);
      camera.lookAt(0, 0, 0);

      // Auto-pick most-upright in-plane orientation for each digit plane.
      const _invQ = group.quaternion.clone().invert();
      const _worldUpLocal = new THREE.Vector3(0, 1, 0).applyQuaternion(_invQ);
      for (const c of allCubes) {
        for (const pl of c.userData.planes) {
          const f = pl.userData.face;
          let bestK = 0, bestDot = -Infinity;
          for (let kk = 0; kk < 4; kk++) {
            const d = f.upCandidates[kk].dot(_worldUpLocal);
            if (d > bestDot) { bestDot = d; bestK = kk; }
          }
          pl.quaternion.copy(f.quats[bestK]);
        }
      }
    },
  };
  return api;
}

// ============================================================================
//  COMMON POLYHEDRAL SHAPE BUILDER
//  Used by kilominx (1 template) and megaminx/icosaminx (3 templates).
//  Each polyhedron shape is just a configuration of build steps below.
// ============================================================================

// ============================================================================
//  SHAPE 2 — SUDOKU KILOMINX  (60 kites, corners-only dodec)
// ============================================================================
function makeKilominxShape() {
  let group = null;
  let pieces = [];
  let kiteGeom = null, kiteOutlineGeom = null, kiteHighlightGeom = null;
  let selected = null;        // sibling group (array)
  let selectedSticker = null; // the specific clicked piece (edit target)
  let givenCount = 0, userEntries = 0;
  let kiteDigitCentroid = [0, 0], kiteDigitSize = 0.5;

  function build() {
    group = new THREE.Group();
    pieces = [];
    selected = null;
    selectedSticker = null;
    givenCount = 0;
    userEntries = 0;
    const sourceGeom = new THREE.DodecahedronGeometry(2.5);
    const faces = extractPolyhedralFaces(sourceGeom);
    sourceGeom.dispose();

    // Kite template [C, mNext, V, mPrev] in face[0]'s local frame.
    const f0 = faces[0];
    const V0     = f0.verts[0];
    const mPrev0 = new THREE.Vector3().addVectors(f0.verts[4], f0.verts[0]).multiplyScalar(0.5);
    const mNext0 = new THREE.Vector3().addVectors(f0.verts[0], f0.verts[1]).multiplyScalar(0.5);
    const xAxis0 = new THREE.Vector3().subVectors(V0, f0.center).normalize();
    const zAxis0 = f0.normal.clone();
    const yAxis0 = new THREE.Vector3().crossVectors(zAxis0, xAxis0).normalize();
    const toLocal = p => {
      const r = new THREE.Vector3().subVectors(p, f0.center);
      return [r.dot(xAxis0), r.dot(yAxis0), r.dot(zAxis0)];
    };
    const Cl = [0, 0, 0];
    const Nl = toLocal(mNext0);
    const Vl = toLocal(V0);
    const Pl = toLocal(mPrev0);
    kiteGeom = new THREE.BufferGeometry();
    kiteGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      Cl[0], Cl[1], Cl[2],
      Nl[0], Nl[1], Nl[2],
      Vl[0], Vl[1], Vl[2],
      Pl[0], Pl[1], Pl[2],
    ]), 3));
    kiteGeom.setIndex([0, 2, 1, 0, 3, 2]); // CCW from outside (kilominx convention)
    kiteGeom.computeVertexNormals();
    const pts2d = [[Cl[0],Cl[1]], [Nl[0],Nl[1]], [Vl[0],Vl[1]], [Pl[0],Pl[1]]];
    kiteOutlineGeom   = makeOutlineGeom(pts2d, 0.022, 0.004);
    kiteHighlightGeom = makeHighlightGeom(pts2d, 0.07, 0.008);
    kiteDigitCentroid = centroidOf2D(pts2d);
    kiteDigitSize     = fitDigitSize(pts2d, 0.75);

    const baseMat = new THREE.MeshStandardMaterial({ color: 0x6a7fc8, roughness: 0.5, metalness: 0.08, flatShading: true });
    for (const f of faces) {
      for (let i = 0; i < 5; i++) {
        const C = f.center;
        const V = f.verts[i];
        const xA = new THREE.Vector3().subVectors(V, C).normalize();
        const zA = f.normal.clone();
        const yA = new THREE.Vector3().crossVectors(zA, xA).normalize();
        const M  = new THREE.Matrix4().makeBasis(xA, yA, zA).setPosition(C);
        const piece = new THREE.Mesh(kiteGeom, baseMat.clone());
        piece.applyMatrix4(M);
        piece.userData = {
          type: 'kite', face: faces.indexOf(f), slot: i, outerVertex: V.clone(),
          digitLocal: { x: kiteDigitCentroid[0], y: kiteDigitCentroid[1], size: kiteDigitSize },
          value: 0, isGiven: false, digit: null,
        };
        const outline = new THREE.Mesh(kiteOutlineGeom, POLY_OUTLINE_MAT);
        outline.renderOrder = 1;
        piece.add(outline);
        group.add(piece);
        pieces.push(piece);
      }
    }
    // 3-sibling corner groups by outer vertex world coords.
    const cornerByKey = new Map();
    for (const p of pieces) {
      const k = POLY_KEY(p.userData.outerVertex);
      if (!cornerByKey.has(k)) cornerByKey.set(k, []);
      cornerByKey.get(k).push(p);
    }
    let cornerIdx = 0;
    for (const members of cornerByKey.values()) {
      for (const p of members) {
        p.userData.corner = cornerIdx;
        p.userData.siblings = members;
        // Add a face id so the shared CSP solver can constrain "5 corners
        // per face, all distinct" via faceField='face'.
        p.userData.face = p.userData.face; // already set above
      }
      cornerIdx++;
    }

    // Seed solvable givens.
    const solved = Sudoku.solvePolyhedral(pieces, { faceField: 'face' });
    const seen = new Set();
    for (const p of pieces) {
      if (seen.has(p)) continue;
      const sibs = p.userData.siblings;
      for (const s of sibs) seen.add(s);
      const val = solved.get(p) | 0;
      if (val === 0) continue;
      if (RNG.random() >= GIVEN_PROBABILITY) continue;
      for (const m of sibs) setPieceDigit(m, val, true);
      givenCount++;
    }
  }

  function setKiteValue(piece, value) {
    if (!piece || piece.userData.isGiven) return;
    const prev = piece.userData.value;
    for (const sib of piece.userData.siblings) setPieceDigit(sib, value, false);
    if (prev === 0 && value !== 0) userEntries++;
    else if (prev !== 0 && value === 0) userEntries--;
    refreshSelected();
    statsEl.innerHTML = api.statsHTML();
  }

  const api = {
    name: 'Sudoku Kilominx',
    subtitle: '60 kite pieces tiling a dodecahedron (corners only).',
    controlsHTML:
      '<kbd>left-click</kbd> select &nbsp; <kbd>1</kbd>–<kbd>9</kbd> fill &nbsp; <kbd>0</kbd>/<kbd>⌫</kbd> clear<br>' +
      '<kbd>right-drag</kbd> rotate &nbsp; <kbd>scroll</kbd> zoom',
    cameraDistance: 9,
    install() { build(); scene.add(group); },
    uninstall() { scene.remove(group); disposeGroup(group); group = null; pieces = []; selectedSticker = null; },
    get pickables() { return pieces; },
    pick(hit) {
      if (selected) for (const m of selected) {
        m.material.emissive.setHex(0x000000); m.material.emissiveIntensity = 1;
        if (m.userData.highlight) { m.remove(m.userData.highlight); m.userData.highlight = null; }
      }
      selectedSticker = hit ? hit.object : null;
      selected = hit ? hit.object.userData.siblings : null;
      if (selected) for (const m of selected) {
        m.material.emissive = new THREE.Color(0xffd166);
        m.material.emissiveIntensity = 0.25;
        const hl = new THREE.LineSegments(kiteHighlightGeom, POLY_HL_MAT);
        hl.renderOrder = 2;
        m.add(hl); m.userData.highlight = hl;
      }
      refreshSelected();
    },
    clearPick() { this.pick(null); },
    keydown(e) {
      return handleDigitKey(e, {
        getTarget: () => selectedSticker,
        onChange:  (piece, value) => setKiteValue(piece, value),
      });
    },
    frame() { updatePolyhedralDigits(pieces, group, camera); },
    selectedInfoHTML() {
      if (!selected) return 'No piece selected';
      const cornerIdx = selected[0].userData.corner;
      const faces = selected.map(m => m.userData.face + 1).sort((a, b) => a - b);
      const ud = selectedSticker ? selectedSticker.userData : selected[0].userData;
      let v;
      if (ud.value === 0)   v = '<span class="dim">empty</span>';
      else if (ud.isGiven)  v = `<span class="given">${ud.value}</span> <span class="dim">(given)</span>`;
      else                  v = `<span class="user">${ud.value}</span>`;
      return `<b>Selected corner</b> <span class="pill kite">Kite</span><br>` +
             `<span class="dim">Corner</span> ${cornerIdx + 1} <span class="dim">/ 20</span><br>` +
             `<span class="dim">Touches faces</span> ${faces.join(', ')}<br>` +
             `<span class="dim">Piece value</span> ${v}`;
    },
    statsHTML() {
      return `<span class="dim">corners</span> <span class="stat-num">20</span><br>` +
             `<span class="dim">stickers</span> <span class="stat-num">60</span><br>` +
             `<span class="dim">given clues</span> <span class="stat-num">${givenCount}</span><br>` +
             `<span class="dim">your entries</span> <span class="stat-num">${userEntries}</span>`;
    },
  };
  return api;
}

// ============================================================================
//  GENERIC MEGA/ICOSA BUILDER
//  Both shapes share the same 1 center + 3-or-5 corners + 3-or-5 edges pattern.
//  Only the source polyhedron and per-face vertex count differ.
// ============================================================================
function makeMinxLikeShape(opts) {
  // opts: { name, subtitle, sourceGeomFactory, totals, statLines, centerLabel }
  // totals: { center, edge, corner }
  // statLines: array of [label, value] for the stats panel
  let group = null;
  let pieces = [];
  let selected = null;
  let selectedSticker = null;
  let givenCount = 0, userEntries = 0;
  let centerGeom = null, centerOutlineGeom = null, centerHighlightGeom = null;
  let edgeGeom = null, edgeOutlineGeom = null, edgeHighlightGeom = null;
  let cornerGeom = null, cornerOutlineGeom = null, cornerHighlightGeom = null;
  let centerDigitInfo = null, cornerDigitInfo = null, edgeDigitInfo = null;

  function build() {
    group = new THREE.Group();
    pieces = [];
    selected = null;
    selectedSticker = null;
    givenCount = 0;
    userEntries = 0;

    let faces;
    const sourceGeom = opts.sourceGeomFactory();
    faces = extractPolyhedralFaces(sourceGeom);
    sourceGeom.dispose();

    const N_VERTS = faces[0].verts.length; // 3 (icos triangle) or 5 (dodec pentagon)
    const INNER_SCALE = 0.42;
    const CORNER_FRAC = 0.34;

    const f0 = faces[0];
    const C0 = f0.center;
    const V0_world = f0.verts[0];
    const xAxis0 = new THREE.Vector3().subVectors(V0_world, C0).normalize();
    const zAxis0 = f0.normal.clone();
    const yAxis0 = new THREE.Vector3().crossVectors(zAxis0, xAxis0).normalize();
    const toLocal = p => {
      const r = new THREE.Vector3().subVectors(p, C0);
      return [r.dot(xAxis0), r.dot(yAxis0), r.dot(zAxis0)];
    };
    const R_outer = new THREE.Vector3().subVectors(V0_world, C0).length();

    // -- CENTER template
    const centerPts = [];
    for (let i = 0; i < N_VERTS; i++) {
      const ang = (2 * Math.PI / N_VERTS) * i;
      centerPts.push([INNER_SCALE * R_outer * Math.cos(ang),
                      INNER_SCALE * R_outer * Math.sin(ang)]);
    }
    centerGeom = new THREE.BufferGeometry();
    const cPos = new Float32Array(centerPts.length * 3);
    for (let i = 0; i < centerPts.length; i++) {
      cPos[i*3+0] = centerPts[i][0]; cPos[i*3+1] = centerPts[i][1]; cPos[i*3+2] = 0;
    }
    centerGeom.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
    // Fan triangulation from vertex 0 (works for any convex polygon).
    const cIdx = [];
    for (let i = 1; i < N_VERTS - 1; i++) cIdx.push(0, i, i + 1);
    centerGeom.setIndex(cIdx);
    centerGeom.computeVertexNormals();
    centerOutlineGeom   = makeOutlineGeom(centerPts, 0.022, 0.004);
    centerHighlightGeom = makeHighlightGeom(centerPts, 0.10, 0.008);
    centerDigitInfo = { x: 0, y: 0, size: fitDigitSize(centerPts, 0.70) };

    // -- CORNER template [W, A, V, B]
    {
      const Vw    = f0.verts[0];
      const Vprev = f0.verts[(0 - 1 + N_VERTS) % N_VERTS];
      const Vnext = f0.verts[1];
      const W = new THREE.Vector3().subVectors(Vw, C0).multiplyScalar(INNER_SCALE).add(C0);
      const A = new THREE.Vector3().lerpVectors(Vw, Vprev, CORNER_FRAC);
      const B = new THREE.Vector3().lerpVectors(Vw, Vnext, CORNER_FRAC);
      const lW = toLocal(W), lA = toLocal(A), lV = toLocal(Vw), lB = toLocal(B);
      const cornerPts = [[lW[0],lW[1]], [lA[0],lA[1]], [lV[0],lV[1]], [lB[0],lB[1]]];
      cornerGeom = new THREE.BufferGeometry();
      cornerGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        lW[0],lW[1],0,  lA[0],lA[1],0,  lV[0],lV[1],0,  lB[0],lB[1],0,
      ]), 3));
      cornerGeom.setIndex([0,1,2, 0,2,3]);
      cornerGeom.computeVertexNormals();
      cornerOutlineGeom   = makeOutlineGeom(cornerPts, 0.022, 0.004);
      cornerHighlightGeom = makeHighlightGeom(cornerPts, 0.10, 0.008);
      const [ccx, ccy] = centroidOf2D(cornerPts);
      cornerDigitInfo = { x: ccx, y: ccy, size: fitDigitSize(cornerPts, 0.70) };
    }

    // -- EDGE template [W_i, B_i, A_{i+1}, W_{i+1}] anchored at edge midpoint
    {
      const Vi   = f0.verts[0];
      const Vi1  = f0.verts[1];
      const Wi   = new THREE.Vector3().subVectors(Vi,  C0).multiplyScalar(INNER_SCALE).add(C0);
      const Wi1  = new THREE.Vector3().subVectors(Vi1, C0).multiplyScalar(INNER_SCALE).add(C0);
      const Bi   = new THREE.Vector3().lerpVectors(Vi,  Vi1, CORNER_FRAC);
      const Ai1  = new THREE.Vector3().lerpVectors(Vi1, Vi,  CORNER_FRAC);
      const Medge = new THREE.Vector3().addVectors(Vi, Vi1).multiplyScalar(0.5);
      const xAxisE = new THREE.Vector3().subVectors(Medge, C0).normalize();
      const yAxisE = new THREE.Vector3().crossVectors(zAxis0, xAxisE).normalize();
      const toLocalE = p => {
        const r = new THREE.Vector3().subVectors(p, C0);
        return [r.dot(xAxisE), r.dot(yAxisE), r.dot(zAxis0)];
      };
      const lWi=toLocalE(Wi), lBi=toLocalE(Bi), lAi1=toLocalE(Ai1), lWi1=toLocalE(Wi1);
      const edgePts = [[lWi[0],lWi[1]], [lBi[0],lBi[1]], [lAi1[0],lAi1[1]], [lWi1[0],lWi1[1]]];
      edgeGeom = new THREE.BufferGeometry();
      edgeGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        lWi[0],lWi[1],0,  lBi[0],lBi[1],0,  lAi1[0],lAi1[1],0,  lWi1[0],lWi1[1],0,
      ]), 3));
      edgeGeom.setIndex([0,1,2, 0,2,3]);
      edgeGeom.computeVertexNormals();
      edgeOutlineGeom   = makeOutlineGeom(edgePts, 0.022, 0.004);
      edgeHighlightGeom = makeHighlightGeom(edgePts, 0.10, 0.008);
      const [ecx, ecy] = centroidOf2D(edgePts);
      edgeDigitInfo = { x: ecx, y: ecy, size: fitDigitSize(edgePts, 0.70) };
    }

    const centerMat = new THREE.MeshStandardMaterial({ color: opts.colors.center, roughness: 0.5, metalness: 0.08, flatShading: true });
    const edgeMat   = new THREE.MeshStandardMaterial({ color: opts.colors.edge,   roughness: 0.5, metalness: 0.08, flatShading: true });
    const cornerMat = new THREE.MeshStandardMaterial({ color: opts.colors.corner, roughness: 0.5, metalness: 0.08, flatShading: true });

    for (let fi = 0; fi < faces.length; fi++) {
      const f = faces[fi];
      const C = f.center, n = f.normal;

      // center
      {
        const xA = new THREE.Vector3().subVectors(f.verts[0], C).normalize();
        const yA = new THREE.Vector3().crossVectors(n, xA).normalize();
        const M  = new THREE.Matrix4().makeBasis(xA, yA, n).setPosition(C);
        const piece = new THREE.Mesh(centerGeom, centerMat.clone());
        piece.applyMatrix4(M);
        piece.userData = {
          type: 'center', face: fi, groupKey: `C${fi}`,
          digitLocal: centerDigitInfo, value: 0, isGiven: false, digit: null,
        };
        const outline = new THREE.Mesh(centerOutlineGeom, POLY_OUTLINE_MAT);
        outline.renderOrder = 1; piece.add(outline);
        group.add(piece); pieces.push(piece);
      }
      // corners
      for (let i = 0; i < N_VERTS; i++) {
        const V = f.verts[i];
        const xA = new THREE.Vector3().subVectors(V, C).normalize();
        const yA = new THREE.Vector3().crossVectors(n, xA).normalize();
        const M  = new THREE.Matrix4().makeBasis(xA, yA, n).setPosition(C);
        const piece = new THREE.Mesh(cornerGeom, cornerMat.clone());
        piece.applyMatrix4(M);
        piece.userData = {
          type: 'corner', face: fi, slot: i, groupKey: `V${POLY_KEY(V)}`,
          digitLocal: cornerDigitInfo, value: 0, isGiven: false, digit: null,
        };
        const outline = new THREE.Mesh(cornerOutlineGeom, POLY_OUTLINE_MAT);
        outline.renderOrder = 1; piece.add(outline);
        group.add(piece); pieces.push(piece);
      }
      // edges
      for (let i = 0; i < N_VERTS; i++) {
        const Vi = f.verts[i], Vi1 = f.verts[(i+1) % N_VERTS];
        const Mp = new THREE.Vector3().addVectors(Vi, Vi1).multiplyScalar(0.5);
        const xA = new THREE.Vector3().subVectors(Mp, C).normalize();
        const yA = new THREE.Vector3().crossVectors(n, xA).normalize();
        const M  = new THREE.Matrix4().makeBasis(xA, yA, n).setPosition(C);
        const piece = new THREE.Mesh(edgeGeom, edgeMat.clone());
        piece.applyMatrix4(M);
        piece.userData = {
          type: 'edge', face: fi, slot: i, groupKey: `E${POLY_KEY(Mp)}`,
          digitLocal: edgeDigitInfo, value: 0, isGiven: false, digit: null,
        };
        const outline = new THREE.Mesh(edgeOutlineGeom, POLY_OUTLINE_MAT);
        outline.renderOrder = 1; piece.add(outline);
        group.add(piece); pieces.push(piece);
      }
    }

    // Sibling grouping by world-space key.
    const groupMap = new Map();
    for (const p of pieces) {
      const k = p.userData.groupKey;
      if (!groupMap.has(k)) groupMap.set(k, []);
      groupMap.get(k).push(p);
    }
    const counters = { center: 0, edge: 0, corner: 0 };
    for (const members of groupMap.values()) {
      const type = members[0].userData.type;
      const gi = counters[type]++;
      for (const m of members) {
        m.userData.siblings = members;
        m.userData.groupIndex = gi;
      }
    }

    // Seed solvable givens via the shared CSP solver. The polyhedral validator
    // is "no duplicate digit per face", which is exactly the constraint
    // Sudoku.solvePolyhedral encodes (one variable per sibling-set, one
    // constraint group per unique face touched).
    const solved = Sudoku.solvePolyhedral(pieces, { faceField: 'face' });
    const seen = new Set();
    for (const p of pieces) {
      if (seen.has(p)) continue;
      const sibs = p.userData.siblings;
      for (const s of sibs) seen.add(s);
      const val = solved.get(p) | 0;
      if (val === 0) continue;
      if (RNG.random() >= GIVEN_PROBABILITY) continue;
      for (const m of sibs) setPieceDigit(m, val, true);
      givenCount++;
    }
  }

  const TYPE_LABEL = { center: 'Center', edge: 'Edge', corner: 'Corner' };
  const HL_BY_TYPE = () => ({ center: centerHighlightGeom, edge: edgeHighlightGeom, corner: cornerHighlightGeom });

  const api = {
    name: opts.name,
    subtitle: opts.subtitle,
    controlsHTML:
      '<kbd>left-click</kbd> select &nbsp; <kbd>1</kbd>–<kbd>9</kbd> fill &nbsp; <kbd>0</kbd>/<kbd>⌫</kbd> clear<br>' +
      '<kbd>right-drag</kbd> rotate &nbsp; <kbd>scroll</kbd> zoom',
    cameraDistance: 9,
    install() { build(); validatePolyhedralFaces(pieces); scene.add(group); },
    uninstall() { scene.remove(group); disposeGroup(group); group = null; pieces = []; selectedSticker = null; },
    get pickables() { return pieces; },
    pick(hit) {
      if (selected) for (const m of selected) {
        m.material.emissive.setHex(0x000000); m.material.emissiveIntensity = 1;
        if (m.userData.highlight) { m.remove(m.userData.highlight); m.userData.highlight = null; }
      }
      selectedSticker = hit ? hit.object : null;
      selected = hit ? hit.object.userData.siblings : null;
      if (selected) {
        const hlGeom = HL_BY_TYPE()[selected[0].userData.type];
        for (const m of selected) {
          m.material.emissive = new THREE.Color(0xffd166);
          m.material.emissiveIntensity = 0.28;
          const hl = new THREE.LineSegments(hlGeom, POLY_HL_MAT);
          hl.renderOrder = 2;
          m.add(hl); m.userData.highlight = hl;
        }
      }
      refreshSelected();
    },
    clearPick() { this.pick(null); },
    keydown(e) {
      return handleDigitKey(e, {
        getTarget: () => selectedSticker,
        onChange: (piece, value) => {
          const prev = piece.userData.value;
          for (const sib of piece.userData.siblings) setPieceDigit(sib, value, false);
          if (prev === 0 && value !== 0) userEntries++;
          else if (prev !== 0 && value === 0) userEntries--;
          validatePolyhedralFaces(pieces);
          refreshSelected();
          statsEl.innerHTML = api.statsHTML();
        },
      });
    },
    frame() { updatePolyhedralDigits(pieces, group, camera); },
    selectedInfoHTML() {
      if (!selected) return 'No piece selected';
      const first = selected[0];
      const type = first.userData.type;
      const gi = first.userData.groupIndex;
      const faces = selected.map(m => m.userData.face + 1).sort((a, b) => a - b);
      const ud = selectedSticker ? selectedSticker.userData : first.userData;
      let v;
      if (ud.value === 0)   v = '<span class="dim">empty</span>';
      else if (ud.isGiven)  v = `<span class="given">${ud.value}</span> <span class="dim">(given)</span>`;
      else                  v = `<span class="user">${ud.value}</span>`;
      return `<b>Selected piece</b> <span class="pill ${type}">${TYPE_LABEL[type]}</span><br>` +
             `<span class="dim">${TYPE_LABEL[type]}</span> ${gi + 1} <span class="dim">/ ${opts.totals[type]}</span><br>` +
             `<span class="dim">Stickers</span> ${selected.length}<br>` +
             `<span class="dim">${faces.length > 1 ? 'Touches faces' : 'On face'}</span> ${faces.join(', ')}<br>` +
             `<span class="dim">Piece value</span> ${v}`;
    },
    statsHTML() {
      const base = opts.statLines.map(([label, val]) =>
        `<span class="dim">${label}</span> <span class="stat-num">${val}</span>`
      ).join('<br>');
      return base +
             `<br><span class="dim">given clues</span> <span class="stat-num">${givenCount}</span>` +
             `<br><span class="dim">your entries</span> <span class="stat-num">${userEntries}</span>`;
    },
  };
  return api;
}

// ============================================================================
//  SUDOKU KILOMINX 45 — dodecahedron, each pentagonal face split into 5 wedges,
//  each wedge subdivided into 9 small triangles (frequency-3). 45 pieces/face,
//  540 pieces total. Constraint: per-wedge sudoku (digits 1–9 once per wedge).
// ============================================================================
function makeKilominx45Shape() {
  let group = null;
  let pieces = [];
  let selected = null;
  let selectedSticker = null;
  let givenCount = 0, userEntries = 0;

  // 3×3 radial-angular subdivision of the isoceles wedge (C, A, B) → 9 quadrilaterals.
  // Radial s: 0 = apex C, 1 = base AB. Angular t: 0 = toward A, 1 = toward B.
  // s_inner > 0 keeps the apex row from collapsing to triangles.
  const S_INNER = 0.32; // inner pentagonal center piece occupies s in [0, S_INNER]
  function buildWedgeQuads(C, A, B) {
    const sLevels = [S_INNER, S_INNER + (1 - S_INNER) / 3, S_INNER + 2 * (1 - S_INNER) / 3, 1];
    const tLevels = [0, 1/3, 2/3, 1];
    const _CA = new THREE.Vector3().subVectors(A, C);
    const _CB = new THREE.Vector3().subVectors(B, C);
    const P = (s, t) => new THREE.Vector3()
      .copy(C)
      .addScaledVector(_CA, s * (1 - t))
      .addScaledVector(_CB, s * t);
    const quads = [];
    for (let i = 0; i < 3; i++)
      for (let j = 0; j < 3; j++) {
        const s0 = sLevels[i], s1 = sLevels[i+1];
        const t0 = tLevels[j], t1 = tLevels[j+1];
        // CCW (viewed from outside / +normal side)
        quads.push([P(s0, t0), P(s1, t0), P(s1, t1), P(s0, t1)]);
      }
    return quads;
  }

  function build() {
    group = new THREE.Group();
    pieces = [];
    selected = null;
    selectedSticker = null;
    givenCount = 0;
    userEntries = 0;

    const sourceGeom = new THREE.DodecahedronGeometry(2.5);
    const faces = extractPolyhedralFaces(sourceGeom);
    sourceGeom.dispose();

    const baseMat = new THREE.MeshStandardMaterial({
      color: 0x6a7fc8, roughness: 0.5, metalness: 0.08, flatShading: true,
    });

    let faceIdx = 0;
    for (const f of faces) {
      const C = f.center, n = f.normal;

      // --- Megaminx-style center pentagon piece ---------------------------
      {
        const cVerts = [];
        for (let vi = 0; vi < 5; vi++) {
          cVerts.push(new THREE.Vector3()
            .copy(C)
            .addScaledVector(new THREE.Vector3().subVectors(f.verts[vi], C), S_INNER));
        }
        const cCtr = C.clone();
        const xA = new THREE.Vector3().subVectors(cVerts[0], cCtr).normalize();
        const yA = new THREE.Vector3().crossVectors(n, xA).normalize();
        const Mc = new THREE.Matrix4().makeBasis(xA, yA, n).setPosition(cCtr);
        const Mci = new THREE.Matrix4().copy(Mc).invert();
        const localPts = cVerts.map(v => v.clone().applyMatrix4(Mci));
        const posArr = new Float32Array(15);
        for (let i = 0; i < 5; i++) {
          posArr[i*3+0] = localPts[i].x;
          posArr[i*3+1] = localPts[i].y;
          posArr[i*3+2] = localPts[i].z;
        }
        const cg = new THREE.BufferGeometry();
        cg.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
        cg.setIndex([0, 1, 2, 0, 2, 3, 0, 3, 4]);
        cg.computeVertexNormals();
        const centerMat = baseMat.clone();
        centerMat.color.setHex(0x9d6cc8);
        const centerPiece = new THREE.Mesh(cg, centerMat);
        centerPiece.applyMatrix4(Mc);
        const pts2dC = localPts.map(p => [p.x, p.y]);
        const ctr2dC = centroidOf2D(pts2dC);
        const sizeC  = fitDigitSize(pts2dC, 0.55);
        centerPiece.userData = {
          type: 'center',
          face: 100000 + faceIdx, // unique per face — no sudoku constraint links
          faceReal: faceIdx,
          wedge: -1,
          slot: -1,
          digitLocal: { x: ctr2dC[0], y: ctr2dC[1], size: sizeC },
          value: 0, isGiven: false, digit: null,
        };
        centerPiece.userData.siblings = [centerPiece];
        const cOutline = new THREE.Mesh(makeOutlineGeom(pts2dC, 0.012, 0.003), POLY_OUTLINE_MAT);
        cOutline.renderOrder = 1;
        centerPiece.add(cOutline);
        group.add(centerPiece);
        pieces.push(centerPiece);
      }

      for (let wi = 0; wi < 5; wi++) {
        const A = f.verts[wi];
        const B = f.verts[(wi + 1) % 5];
        const wedgeQuads = buildWedgeQuads(C, A, B);
        // Use a combined wedge ID for per-wedge validation via validatePolyhedralFaces.
        const wedgeId = faceIdx * 5 + wi;
        for (let ti = 0; ti < wedgeQuads.length; ti++) {
          const [P0, P1, P2, P3] = wedgeQuads[ti];
          const ctr = new THREE.Vector3().add(P0).add(P1).add(P2).add(P3).multiplyScalar(1 / 4);
          const xA = new THREE.Vector3().subVectors(P0, ctr).normalize();
          const yA = new THREE.Vector3().crossVectors(n, xA).normalize();
          const M  = new THREE.Matrix4().makeBasis(xA, yA, n).setPosition(ctr);
          const Mi = new THREE.Matrix4().copy(M).invert();
          const p0L = P0.clone().applyMatrix4(Mi);
          const p1L = P1.clone().applyMatrix4(Mi);
          const p2L = P2.clone().applyMatrix4(Mi);
          const p3L = P3.clone().applyMatrix4(Mi);
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
            p0L.x, p0L.y, p0L.z,
            p1L.x, p1L.y, p1L.z,
            p2L.x, p2L.y, p2L.z,
            p3L.x, p3L.y, p3L.z,
          ]), 3));
          g.setIndex([0, 1, 2, 0, 2, 3]);
          g.computeVertexNormals();
          const piece = new THREE.Mesh(g, baseMat.clone());
          piece.applyMatrix4(M);
          const pts2d = [[p0L.x, p0L.y], [p1L.x, p1L.y], [p2L.x, p2L.y], [p3L.x, p3L.y]];
          const ctr2d = centroidOf2D(pts2d);
          const size  = fitDigitSize(pts2d, 0.70);
          piece.userData = {
            type: 'quad',
            face: wedgeId,     // per-wedge validation
            faceReal: faceIdx, // for UI display
            wedge: wi,
            slot: ti,
            digitLocal: { x: ctr2d[0], y: ctr2d[1], size },
            value: 0, isGiven: false, digit: null,
          };
          piece.userData.siblings = [piece];
          const outline = new THREE.Mesh(makeOutlineGeom(pts2d, 0.012, 0.003), POLY_OUTLINE_MAT);
          outline.renderOrder = 1;
          piece.add(outline);
          group.add(piece);
          pieces.push(piece);
        }
      }
      faceIdx++;
    }
  }

  // Seed solvable givens. Run AFTER mergeSiblingsByPolyhedronEdge so that
  // cells which became siblings across the dihedral edge share a single
  // CSP variable (otherwise the merge's propagation would overwrite
  // independently-chosen values and break per-wedge distinctness).
  function seedGivens() {
    givenCount = 0;
    const solved = Sudoku.solvePolyhedral(pieces, { faceField: 'face' });
    const seen = new Set();
    // Quads: reveal each variable with probability GIVEN_PROBABILITY.
    for (const p of pieces) {
      if (seen.has(p)) continue;
      const sibs = p.userData.siblings && p.userData.siblings.length ? p.userData.siblings : [p];
      for (const s of sibs) seen.add(s);
      const val = solved.get(p) | 0;
      if (val === 0) continue;
      const reveal = (p.userData.type === 'center') ? 0.4 : GIVEN_PROBABILITY;
      if (RNG.random() >= reveal) continue;
      for (const m of sibs) setPieceDigit(m, val, true);
      givenCount++;
    }
  }

  const api = {
    name: 'Sudoku Megaminx 46',
    subtitle: '12 dodecahedral faces × 46 pieces (1 center + 5 wedges × 9 quads). Per-wedge sudoku, free centers.',
    controlsHTML:
      '<kbd>left-click</kbd> select &nbsp; <kbd>1</kbd>–<kbd>9</kbd> fill &nbsp; <kbd>0</kbd>/<kbd>⌫</kbd> clear<br>' +
      '<kbd>right-drag</kbd> rotate &nbsp; <kbd>scroll</kbd> zoom',
    cameraDistance: 9,
    install() { build(); mergeSiblingsByPolyhedronEdge(pieces); seedGivens(); validatePolyhedralFaces(pieces); scene.add(group); },
    uninstall() { scene.remove(group); disposeGroup(group); group = null; pieces = []; selectedSticker = null; selected = null; },
    get pickables() { return pieces; },
    pick(hit) {
      if (selected) for (const m of selected) {
        m.material.emissive.setHex(0x000000); m.material.emissiveIntensity = 1;
      }
      selectedSticker = hit ? hit.object : null;
      selected = hit ? hit.object.userData.siblings : null;
      if (selected) for (const m of selected) {
        m.material.emissive = new THREE.Color(0xffd166);
        m.material.emissiveIntensity = 0.30;
      }
      refreshSelected();
    },
    clearPick() { this.pick(null); },
    keydown(e) {
      return handleDigitKey(e, {
        getTarget: () => selectedSticker,
        onChange: (piece, value) => {
          const prev = piece.userData.value;
          for (const sib of piece.userData.siblings) setPieceDigit(sib, value, false);
          if (prev === 0 && value !== 0) userEntries++;
          else if (prev !== 0 && value === 0) userEntries--;
          validatePolyhedralFaces(pieces);
          refreshSelected();
          statsEl.innerHTML = api.statsHTML();
        },
      });
    },
    frame() { updatePolyhedralDigits(pieces, group, camera); },
    selectedInfoHTML() {
      if (!selected) return 'No piece selected';
      const ud = selectedSticker.userData;
      let v;
      if (ud.value === 0)   v = '<span class="dim">empty</span>';
      else if (ud.isGiven)  v = `<span class="given">${ud.value}</span> <span class="dim">(given)</span>`;
      else                  v = `<span class="user">${ud.value}</span>`;
      if (ud.type === 'center') {
        return `<b>Selected piece</b> <span class="pill quad">Center</span><br>` +
               `<span class="dim">Face</span> ${ud.faceReal + 1} <span class="dim">/ 12</span><br>` +
               `<span class="dim">Piece value</span> ${v}`;
      }
      return `<b>Selected piece</b> <span class="pill quad">Quad</span><br>` +
             `<span class="dim">Face</span> ${ud.faceReal + 1} <span class="dim">/ 12</span><br>` +
             `<span class="dim">Wedge</span> ${ud.wedge + 1} <span class="dim">/ 5</span><br>` +
             `<span class="dim">Cell</span> ${ud.slot + 1} <span class="dim">/ 9</span><br>` +
             `<span class="dim">Piece value</span> ${v}`;
    },
    statsHTML() {
      return `<span class="dim">faces</span> <span class="stat-num">12</span><br>` +
             `<span class="dim">pieces/face</span> <span class="stat-num">46</span> <span class="dim">(1 center + 45 quads)</span><br>` +
             `<span class="dim">total pieces</span> <span class="stat-num">${pieces.length}</span><br>` +
             `<span class="dim">given clues</span> <span class="stat-num">${givenCount}</span><br>` +
             `<span class="dim">your entries</span> <span class="stat-num">${userEntries}</span>`;
    },
  };
  return api;
}

// ============================================================================
//  TRUNCATED ICOSAHEDRON (soccer ball) — 12 pentagons + 20 hexagons
//  Used by the Tuttminx shape below.
// ============================================================================
function buildTruncatedIcosahedronFaces(targetRadius) {
  const phi = (1 + Math.sqrt(5)) / 2;
  // 12 icosahedron vertices: cyclic perms of (0, ±1, ±φ).
  const V = [];
  for (const s1 of [-1, 1]) for (const s2 of [-1, 1]) {
    V.push(new THREE.Vector3(0, s1, s2 * phi));
    V.push(new THREE.Vector3(s1, s2 * phi, 0));
    V.push(new THREE.Vector3(s1 * phi, 0, s2));
  }
  // Edge length squared on this ico = 4 (standard).
  const EDGE2 = 4;
  const N = V.length; // 12
  const neighbors = Array.from({ length: N }, () => []);
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    if (Math.abs(V[i].distanceToSquared(V[j]) - EDGE2) < 1e-4) {
      neighbors[i].push(j);
      neighbors[j].push(i);
    }
  }

  // Triangular faces of the ico (20), oriented CCW outward.
  const triFaces = [];
  const seen = new Set();
  for (let i = 0; i < N; i++) {
    const nb = neighbors[i];
    for (let a = 0; a < nb.length; a++) for (let b = a + 1; b < nb.length; b++) {
      const j = nb[a], k = nb[b];
      if (!neighbors[j].includes(k)) continue;
      const sorted = [i, j, k].sort((x, y) => x - y);
      const key = sorted.join(',');
      if (seen.has(key)) continue;
      seen.add(key);
      // Orient CCW when viewed from outside (origin → out).
      const A = V[sorted[0]], B = V[sorted[1]], C = V[sorted[2]];
      const cross = new THREE.Vector3().subVectors(B, A)
        .cross(new THREE.Vector3().subVectors(C, A));
      if (cross.dot(A) < 0) triFaces.push([sorted[0], sorted[2], sorted[1]]);
      else                  triFaces.push([sorted[0], sorted[1], sorted[2]]);
    }
  }

  // Sort the 5 neighbors of each vertex CCW around it (viewed from outside).
  function neighborsCCW(vi) {
    const c = V[vi];
    const nrm = c.clone().normalize();
    const ref = new THREE.Vector3().subVectors(V[neighbors[vi][0]], c);
    const x = ref.clone().sub(nrm.clone().multiplyScalar(ref.dot(nrm))).normalize();
    const y = new THREE.Vector3().crossVectors(nrm, x);
    return [...neighbors[vi]].sort((a, b) => {
      const va = new THREE.Vector3().subVectors(V[a], c);
      const vb = new THREE.Vector3().subVectors(V[b], c);
      return Math.atan2(va.dot(y), va.dot(x)) - Math.atan2(vb.dot(y), vb.dot(x));
    });
  }

  const faces = [];

  // Pentagon faces: 1 per original ico vertex, cut at 1/3 along each edge.
  for (let vi = 0; vi < N; vi++) {
    const nbs = neighborsCCW(vi);
    const verts = nbs.map(ni => new THREE.Vector3()
      .copy(V[vi])
      .addScaledVector(new THREE.Vector3().subVectors(V[ni], V[vi]), 1 / 3));
    const center = verts.reduce((acc, p) => acc.add(p), new THREE.Vector3()).multiplyScalar(1 / verts.length);
    faces.push({ verts, center, normal: center.clone().normalize(), sides: 5 });
  }

  // Hexagon faces: 1 per original triangle. Walk around the triangle taking
  // the two 1/3 cut points on each edge in CCW order.
  for (const [a, b, c] of triFaces) {
    const A = V[a], B = V[b], C = V[c];
    const verts = [
      new THREE.Vector3().copy(A).addScaledVector(new THREE.Vector3().subVectors(B, A), 1 / 3),
      new THREE.Vector3().copy(B).addScaledVector(new THREE.Vector3().subVectors(A, B), 1 / 3),
      new THREE.Vector3().copy(B).addScaledVector(new THREE.Vector3().subVectors(C, B), 1 / 3),
      new THREE.Vector3().copy(C).addScaledVector(new THREE.Vector3().subVectors(B, C), 1 / 3),
      new THREE.Vector3().copy(C).addScaledVector(new THREE.Vector3().subVectors(A, C), 1 / 3),
      new THREE.Vector3().copy(A).addScaledVector(new THREE.Vector3().subVectors(C, A), 1 / 3),
    ];
    const center = verts.reduce((acc, p) => acc.add(p), new THREE.Vector3()).multiplyScalar(1 / verts.length);
    faces.push({ verts, center, normal: center.clone().normalize(), sides: 6 });
  }

  // Scale so the furthest vertex sits at `targetRadius`.
  let maxR = 0;
  for (const f of faces) for (const v of f.verts) maxR = Math.max(maxR, v.length());
  const k = targetRadius / maxR;
  for (const f of faces) {
    for (const v of f.verts) v.multiplyScalar(k);
    f.center.multiplyScalar(k);
  }
  return faces;
}

// ============================================================================
//  SUDOKU TUTTMINX — 32 faces (12 pentagons + 20 hexagons), megaminx-style
//  per-face center + per-wedge 3×3 quads. Per-wedge 1–9 sudoku.
// ============================================================================
function makeTuttminxShape() {
  let group = null;
  let pieces = [];
  let selected = null;
  let selectedSticker = null;
  let givenCount = 0, userEntries = 0;

  const S_INNER = 0.32; // shared inner radius for center piece

  function buildWedgeQuads(C, A, B) {
    const sLevels = [S_INNER, S_INNER + (1 - S_INNER) / 3, S_INNER + 2 * (1 - S_INNER) / 3, 1];
    const tLevels = [0, 1/3, 2/3, 1];
    const _CA = new THREE.Vector3().subVectors(A, C);
    const _CB = new THREE.Vector3().subVectors(B, C);
    const P = (s, t) => new THREE.Vector3()
      .copy(C)
      .addScaledVector(_CA, s * (1 - t))
      .addScaledVector(_CB, s * t);
    const quads = [];
    for (let i = 0; i < 3; i++)
      for (let j = 0; j < 3; j++) {
        quads.push([
          P(sLevels[i],   tLevels[j]),
          P(sLevels[i+1], tLevels[j]),
          P(sLevels[i+1], tLevels[j+1]),
          P(sLevels[i],   tLevels[j+1]),
        ]);
      }
    return quads;
  }

  function build() {
    group = new THREE.Group();
    pieces = [];
    selected = null;
    selectedSticker = null;
    givenCount = 0;
    userEntries = 0;

    const faces = buildTruncatedIcosahedronFaces(2.6);

    const baseMatPent = new THREE.MeshStandardMaterial({
      color: 0x6a7fc8, roughness: 0.5, metalness: 0.08, flatShading: true,
    });
    const baseMatHex = new THREE.MeshStandardMaterial({
      color: 0x4f8a6e, roughness: 0.5, metalness: 0.08, flatShading: true,
    });
    const centerColorPent = 0x9d6cc8;
    const centerColorHex  = 0xc89d6c;

    let faceIdx = 0;
    for (const f of faces) {
      const C = f.center, n = f.normal;
      const nSides = f.verts.length; // 5 or 6
      const baseMat = (nSides === 5) ? baseMatPent : baseMatHex;
      const centerColor = (nSides === 5) ? centerColorPent : centerColorHex;

      // ----- center polygon piece -----
      {
        const cVerts = [];
        for (let vi = 0; vi < nSides; vi++) {
          cVerts.push(new THREE.Vector3()
            .copy(C)
            .addScaledVector(new THREE.Vector3().subVectors(f.verts[vi], C), S_INNER));
        }
        const xA = new THREE.Vector3().subVectors(cVerts[0], C).normalize();
        const yA = new THREE.Vector3().crossVectors(n, xA).normalize();
        const Mc = new THREE.Matrix4().makeBasis(xA, yA, n).setPosition(C);
        const Mci = new THREE.Matrix4().copy(Mc).invert();
        const localPts = cVerts.map(v => v.clone().applyMatrix4(Mci));
        const posArr = new Float32Array(nSides * 3);
        for (let i = 0; i < nSides; i++) {
          posArr[i*3+0] = localPts[i].x;
          posArr[i*3+1] = localPts[i].y;
          posArr[i*3+2] = localPts[i].z;
        }
        const idx = [];
        for (let i = 1; i < nSides - 1; i++) idx.push(0, i, i + 1);
        const cg = new THREE.BufferGeometry();
        cg.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
        cg.setIndex(idx);
        cg.computeVertexNormals();
        const centerMat = baseMat.clone();
        centerMat.color.setHex(centerColor);
        const centerPiece = new THREE.Mesh(cg, centerMat);
        centerPiece.applyMatrix4(Mc);
        const pts2dC = localPts.map(p => [p.x, p.y]);
        const ctr2dC = centroidOf2D(pts2dC);
        const sizeC  = fitDigitSize(pts2dC, 0.55);
        centerPiece.userData = {
          type: 'center',
          face: 100000 + faceIdx,
          faceReal: faceIdx,
          faceSides: nSides,
          wedge: -1,
          slot: -1,
          digitLocal: { x: ctr2dC[0], y: ctr2dC[1], size: sizeC },
          value: 0, isGiven: false, digit: null,
        };
        centerPiece.userData.siblings = [centerPiece];
        const cOutline = new THREE.Mesh(makeOutlineGeom(pts2dC, 0.012, 0.003), POLY_OUTLINE_MAT);
        cOutline.renderOrder = 1;
        centerPiece.add(cOutline);
        group.add(centerPiece);
        pieces.push(centerPiece);
      }

      // ----- wedge quads -----
      for (let wi = 0; wi < nSides; wi++) {
        const A = f.verts[wi];
        const B = f.verts[(wi + 1) % nSides];
        const wedgeQuads = buildWedgeQuads(C, A, B);
        const wedgeId = faceIdx * 16 + wi; // 16 leaves room for hex (6) without collisions
        for (let ti = 0; ti < wedgeQuads.length; ti++) {
          const [P0, P1, P2, P3] = wedgeQuads[ti];
          const ctr = new THREE.Vector3().add(P0).add(P1).add(P2).add(P3).multiplyScalar(1 / 4);
          const xA = new THREE.Vector3().subVectors(P0, ctr).normalize();
          const yA = new THREE.Vector3().crossVectors(n, xA).normalize();
          const M  = new THREE.Matrix4().makeBasis(xA, yA, n).setPosition(ctr);
          const Mi = new THREE.Matrix4().copy(M).invert();
          const p0L = P0.clone().applyMatrix4(Mi);
          const p1L = P1.clone().applyMatrix4(Mi);
          const p2L = P2.clone().applyMatrix4(Mi);
          const p3L = P3.clone().applyMatrix4(Mi);
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
            p0L.x, p0L.y, p0L.z,
            p1L.x, p1L.y, p1L.z,
            p2L.x, p2L.y, p2L.z,
            p3L.x, p3L.y, p3L.z,
          ]), 3));
          g.setIndex([0, 1, 2, 0, 2, 3]);
          g.computeVertexNormals();
          const piece = new THREE.Mesh(g, baseMat.clone());
          piece.applyMatrix4(M);
          const pts2d = [[p0L.x, p0L.y], [p1L.x, p1L.y], [p2L.x, p2L.y], [p3L.x, p3L.y]];
          const ctr2d = centroidOf2D(pts2d);
          const size  = fitDigitSize(pts2d, 0.70);
          piece.userData = {
            type: 'quad',
            face: wedgeId,
            faceReal: faceIdx,
            faceSides: nSides,
            wedge: wi,
            slot: ti,
            digitLocal: { x: ctr2d[0], y: ctr2d[1], size },
            value: 0, isGiven: false, digit: null,
          };
          piece.userData.siblings = [piece];
          const outline = new THREE.Mesh(makeOutlineGeom(pts2d, 0.012, 0.003), POLY_OUTLINE_MAT);
          outline.renderOrder = 1;
          piece.add(outline);
          group.add(piece);
          pieces.push(piece);
        }
      }
      faceIdx++;
    }
  }

  // Solvable givens (run after merge so cross-edge siblings share one value).
  function seedGivens() {
    givenCount = 0;
    const solved = Sudoku.solvePolyhedral(pieces, { faceField: 'face' });
    const seen = new Set();
    for (const p of pieces) {
      if (seen.has(p)) continue;
      const sibs = p.userData.siblings && p.userData.siblings.length ? p.userData.siblings : [p];
      for (const s of sibs) seen.add(s);
      const val = solved.get(p) | 0;
      if (val === 0) continue;
      const reveal = (p.userData.type === 'center') ? 0.4 : GIVEN_PROBABILITY;
      if (RNG.random() >= reveal) continue;
      for (const m of sibs) setPieceDigit(m, val, true);
      givenCount++;
    }
  }

  const api = {
    name: 'Sudoku Tuttminx',
    subtitle: '32 truncated-icosahedron faces (12 pentagons + 20 hexagons) — per-wedge sudoku, free centers.',
    controlsHTML:
      '<kbd>left-click</kbd> select &nbsp; <kbd>1</kbd>–<kbd>9</kbd> fill &nbsp; <kbd>0</kbd>/<kbd>⌫</kbd> clear<br>' +
      '<kbd>right-drag</kbd> rotate &nbsp; <kbd>scroll</kbd> zoom',
    cameraDistance: 10,
    install() { build(); mergeSiblingsByPolyhedronEdge(pieces); seedGivens(); validatePolyhedralFaces(pieces); scene.add(group); },
    uninstall() { scene.remove(group); disposeGroup(group); group = null; pieces = []; selectedSticker = null; selected = null; },
    get pickables() { return pieces; },
    pick(hit) {
      if (selected) for (const m of selected) {
        m.material.emissive.setHex(0x000000); m.material.emissiveIntensity = 1;
      }
      selectedSticker = hit ? hit.object : null;
      selected = hit ? hit.object.userData.siblings : null;
      if (selected) for (const m of selected) {
        m.material.emissive = new THREE.Color(0xffd166);
        m.material.emissiveIntensity = 0.30;
      }
      refreshSelected();
    },
    clearPick() { this.pick(null); },
    keydown(e) {
      return handleDigitKey(e, {
        getTarget: () => selectedSticker,
        onChange: (piece, value) => {
          const prev = piece.userData.value;
          for (const sib of piece.userData.siblings) setPieceDigit(sib, value, false);
          if (prev === 0 && value !== 0) userEntries++;
          else if (prev !== 0 && value === 0) userEntries--;
          validatePolyhedralFaces(pieces);
          refreshSelected();
          statsEl.innerHTML = api.statsHTML();
        },
      });
    },
    frame() { updatePolyhedralDigits(pieces, group, camera); },
    selectedInfoHTML() {
      if (!selected) return 'No piece selected';
      const ud = selectedSticker.userData;
      let v;
      if (ud.value === 0)   v = '<span class="dim">empty</span>';
      else if (ud.isGiven)  v = `<span class="given">${ud.value}</span> <span class="dim">(given)</span>`;
      else                  v = `<span class="user">${ud.value}</span>`;
      const faceLabel = (ud.faceSides === 5) ? 'pentagon' : 'hexagon';
      if (ud.type === 'center') {
        return `<b>Selected piece</b> <span class="pill quad">Center</span><br>` +
               `<span class="dim">Face</span> ${ud.faceReal + 1} <span class="dim">/ 32 (${faceLabel})</span><br>` +
               `<span class="dim">Piece value</span> ${v}`;
      }
      return `<b>Selected piece</b> <span class="pill quad">Quad</span><br>` +
             `<span class="dim">Face</span> ${ud.faceReal + 1} <span class="dim">/ 32 (${faceLabel})</span><br>` +
             `<span class="dim">Wedge</span> ${ud.wedge + 1} <span class="dim">/ ${ud.faceSides}</span><br>` +
             `<span class="dim">Cell</span> ${ud.slot + 1} <span class="dim">/ 9</span><br>` +
             `<span class="dim">Piece value</span> ${v}`;
    },
    statsHTML() {
      return `<span class="dim">faces</span> <span class="stat-num">32</span> <span class="dim">(12 pent + 20 hex)</span><br>` +
             `<span class="dim">pentagons</span> <span class="stat-num">46</span> <span class="dim">pieces each (1+45)</span><br>` +
             `<span class="dim">hexagons</span> <span class="stat-num">55</span> <span class="dim">pieces each (1+54)</span><br>` +
             `<span class="dim">total pieces</span> <span class="stat-num">${pieces.length}</span><br>` +
             `<span class="dim">given clues</span> <span class="stat-num">${givenCount}</span><br>` +
             `<span class="dim">your entries</span> <span class="stat-num">${userEntries}</span>`;
    },
  };
  return api;
}

// ============================================================================
//  SUDOKU TERAMINX — dodecahedron, megaminx base with each piece subdivided.
//  Per face:  1 center pentagon
//           + 5 edge "stacks" (each = 3 trapezoid strips, tapering outward)
//           + 5 corner diamonds (each = 3×3 grid = 9 cells)
//           = 1 + 15 + 45 = 61 cells per face. 12 × 61 = 732 cells total.
//  Sudoku rule: each corner 3×3 is a 1–9 box; edge strips & centers
//  carry decorative givens.
// ============================================================================
function makeTeraminxShape(opts = {}) {
  const {
    name = 'Sudoku Teraminx',
    subtitle = '12 dodecahedral faces × 61 pieces (1 center + 5 edge stacks × 3 strips + 5 corners × 3×3). Each corner is one Sudoku box.',
    centerRadius = 0.42,
    alpha = 0.36,
    // When true, the central pentagon and the innermost edge strip of every
    // stack are rendered as dark "blocked" pieces — non-pickable, no digits,
    // not validated. Used by Elite Kilominx to hide the centers.
    blockInner = false,
    // When true, chain diamond rows across face edges into shared row
    // constraints (each chain = 6 cells across 2 adjacent corner-boxes,
    // 1-9 distinct).
    rowConstraints = false,
  } = opts;

  let group = null;
  let pieces = [];
  let selected = null;
  let selectedSticker = null;
  let givenCount = 0, userEntries = 0;

  // Megaminx base parameters.
  // The inner pentagon has vertices on the rays from face center C through
  // each face vertex V[i], at fraction CENTER_RADIUS. Each edge "stack" is a
  // trapezoid whose inner edge runs along one side of the inner pentagon and
  // whose outer edge is the middle (1−2·ALPHA) of one face edge. With
  // CENTER_RADIUS > 1−2·ALPHA the inner edge is LONGER than the outer edge,
  // so the slanted sides converge OUTWARD (toward the face perimeter) and
  // each strip's tangential width shrinks moving outward.
  const CENTER_RADIUS = centerRadius;
  // ALPHA = fraction of each face edge the corner-diamond claims at each end.
  const ALPHA = alpha;
  // Subdivision counts.
  const EDGE_STRIPS = 3;   // each edge trapezoid → 3 radial strips
  const CORNER_N    = 3;   // each corner diamond → 3×3 grid (9 cells)
  // Radial cut points (fractions along inner→outer) for the edge strips.
  // All three strips have equal radial height; only their tangential width
  // changes (shrinking outward thanks to the trapezoid taper).
  const EDGE_CUTS = [0.00, 1 / 3, 2 / 3, 1.00];

  function lerp3(C, V, t) {
    return new THREE.Vector3()
      .copy(C)
      .addScaledVector(new THREE.Vector3().subVectors(V, C), t);
  }
  function lerpV3(A, B, t) {
    return new THREE.Vector3()
      .copy(A)
      .addScaledVector(new THREE.Vector3().subVectors(B, A), t);
  }
  // Bilinear interpolation over a quad with CCW corners [P00, P10, P11, P01].
  function bilerpV3(P00, P10, P11, P01, u, v) {
    const bottom = lerpV3(P00, P10, u);
    const top    = lerpV3(P01, P11, u);
    return lerpV3(bottom, top, v);
  }

  // Build a flat quad piece from 4 world-space corner points (assumed
  // CCW viewed from outside, i.e. cross(P1-P0, P2-P0) ⋅ n > 0).
  function makeQuadPiece(P0, P1, P2, P3, n, baseMat, ud) {
    const ctr = new THREE.Vector3().add(P0).add(P1).add(P2).add(P3).multiplyScalar(0.25);
    const xA = new THREE.Vector3().subVectors(P0, ctr).normalize();
    const yA = new THREE.Vector3().crossVectors(n, xA).normalize();
    const M  = new THREE.Matrix4().makeBasis(xA, yA, n).setPosition(ctr);
    const Mi = new THREE.Matrix4().copy(M).invert();
    const p0L = P0.clone().applyMatrix4(Mi);
    const p1L = P1.clone().applyMatrix4(Mi);
    const p2L = P2.clone().applyMatrix4(Mi);
    const p3L = P3.clone().applyMatrix4(Mi);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      p0L.x, p0L.y, p0L.z,
      p1L.x, p1L.y, p1L.z,
      p2L.x, p2L.y, p2L.z,
      p3L.x, p3L.y, p3L.z,
    ]), 3));
    g.setIndex([0, 1, 2, 0, 2, 3]);
    g.computeVertexNormals();
    const piece = new THREE.Mesh(g, baseMat.clone());
    piece.applyMatrix4(M);
    const pts2d = [[p0L.x, p0L.y], [p1L.x, p1L.y], [p2L.x, p2L.y], [p3L.x, p3L.y]];
    const ctr2d = centroidOf2D(pts2d);
    const size  = fitDigitSize(pts2d, 0.70);
    ud.digitLocal = { x: ctr2d[0], y: ctr2d[1], size };
    ud.value = 0; ud.isGiven = false; ud.digit = null;
    piece.userData = ud;
    piece.userData.siblings = [piece];
    const outline = new THREE.Mesh(makeOutlineGeom(pts2d, 0.012, 0.003), POLY_OUTLINE_MAT);
    outline.renderOrder = 1;
    piece.add(outline);
    return piece;
  }

  function build() {
    group = new THREE.Group();
    pieces = [];
    selected = null;
    selectedSticker = null;
    givenCount = 0;
    userEntries = 0;

    const sourceGeom = new THREE.DodecahedronGeometry(2.5);
    const faces = extractPolyhedralFaces(sourceGeom);
    sourceGeom.dispose();

    // 3 growing edge-strip materials (lightening outward) + 3×3 corner
    // materials (slight per-cell variation for visual depth).
    const edgeMats = [
      new THREE.MeshStandardMaterial({ color: 0x5a73c0, roughness: 0.5, metalness: 0.08, flatShading: true }),
      new THREE.MeshStandardMaterial({ color: 0x7387d0, roughness: 0.5, metalness: 0.08, flatShading: true }),
      new THREE.MeshStandardMaterial({ color: 0x8c9be0, roughness: 0.5, metalness: 0.08, flatShading: true }),
    ];
    const cornerMat = new THREE.MeshStandardMaterial({
      color: 0xa07acc, roughness: 0.5, metalness: 0.08, flatShading: true,
    });
    const centerMat = new THREE.MeshStandardMaterial({
      color: 0xc89d4a, roughness: 0.5, metalness: 0.08, flatShading: true,
    });
    const blockedMat = new THREE.MeshStandardMaterial({
      color: 0x141414, roughness: 0.95, metalness: 0.0, flatShading: true,
    });

    let faceIdx = 0;
    for (const f of faces) {
      const C = f.center, n = f.normal;

      // ----- central pentagon piece -----
      {
        const verts = f.verts.map(v => lerp3(C, v, CENTER_RADIUS));
        const xA = new THREE.Vector3().subVectors(verts[0], C).normalize();
        const yA = new THREE.Vector3().crossVectors(n, xA).normalize();
        const Mc = new THREE.Matrix4().makeBasis(xA, yA, n).setPosition(C);
        const Mci = new THREE.Matrix4().copy(Mc).invert();
        const localPts = verts.map(v => v.clone().applyMatrix4(Mci));
        const posArr = new Float32Array(15);
        for (let i = 0; i < 5; i++) {
          posArr[i*3+0] = localPts[i].x;
          posArr[i*3+1] = localPts[i].y;
          posArr[i*3+2] = localPts[i].z;
        }
        const cg = new THREE.BufferGeometry();
        cg.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
        cg.setIndex([0, 1, 2, 0, 2, 3, 0, 3, 4]);
        cg.computeVertexNormals();
        const centerPiece = new THREE.Mesh(cg, (blockInner ? blockedMat : centerMat).clone());
        centerPiece.applyMatrix4(Mc);
        const pts2dC = localPts.map(p => [p.x, p.y]);
        const ctr2dC = centroidOf2D(pts2dC);
        const sizeC  = fitDigitSize(pts2dC, 0.55);
        centerPiece.userData = {
          type: blockInner ? 'blocked' : 'center',
          face: faceIdx * 1000,
          faceReal: faceIdx,
          digitLocal: { x: ctr2dC[0], y: ctr2dC[1], size: sizeC },
          value: 0, isGiven: false, digit: null,
        };
        centerPiece.userData.siblings = [centerPiece];
        const cOutline = new THREE.Mesh(makeOutlineGeom(pts2dC, 0.012, 0.003), POLY_OUTLINE_MAT);
        cOutline.renderOrder = 1;
        centerPiece.add(cOutline);
        group.add(centerPiece);
        if (!blockInner) pieces.push(centerPiece);
      }

      // Megaminx-base annular geometry: inner pentagon + outer (face) vertices
      // plus per-edge cut points.
      const I = f.verts.map(v => lerp3(C, v, CENTER_RADIUS));
      const O = f.verts.map(v => v.clone());
      const Y = [], X = [];
      for (let i = 0; i < 5; i++) {
        const a = O[i], b = O[(i + 1) % 5];
        Y.push(lerpV3(a, b, ALPHA));        // near O[i] on edge i
        X.push(lerpV3(a, b, 1 - ALPHA));    // near O[i+1] on edge i
      }

      // ----- 5 edge stacks. Each stack is a trapezoid whose slanted sides
      //       go from inner-pentagon corner I[i]/I[i+1] outward to the
      //       face-edge cut points Y[i]/X[i]. With CENTER_RADIUS > 1−2·ALPHA
      //       the stack is WIDER on the inside than on the outside, so its
      //       sides converge outward and every successive sub-strip is
      //       tangentially narrower than the previous one.
      for (let i = 0; i < 5; i++) {
        const innerLeft  = I[i];
        const innerRight = I[(i + 1) % 5];
        const outerLeft  = Y[i];
        const outerRight = X[i];
        for (let s = 0; s < EDGE_STRIPS; s++) {
          const t0 = EDGE_CUTS[s];
          const t1 = EDGE_CUTS[s + 1];
          // CCW from outside: inner-left, outer-left, outer-right, inner-right.
          const P0 = lerpV3(innerLeft,  outerLeft,  t0);
          const P1 = lerpV3(innerLeft,  outerLeft,  t1);
          const P2 = lerpV3(innerRight, outerRight, t1);
          const P3 = lerpV3(innerRight, outerRight, t0);
          const isBlocked = blockInner;
          const strip = makeQuadPiece(
            P0, P1, P2, P3,
            n,
            isBlocked ? blockedMat : edgeMats[s],
            {
              type: isBlocked ? 'blocked' : 'trapezoid',
              face: faceIdx * 1000 + 100 + i * 10 + s,
              faceReal: faceIdx,
              edgeIdx: i,
              strip: s,
            },
          );
          group.add(strip);
          if (!isBlocked) pieces.push(strip);
        }
      }

      // ----- 5 corner diamonds. Each diamond [I_i, X_{i−1}, O_i, Y_i] (CCW
      //       from outside) is subdivided into a 3×3 grid forming one Sudoku
      //       box. The diamond naturally tapers (its width shrinks) toward
      //       the face vertex O_i.
      for (let i = 0; i < 5; i++) {
        const P00 = I[i];                       // inner vertex (radially in)
        const P10 = X[(i - 1 + 5) % 5];         // side cut (CCW-previous edge)
        const P11 = O[i];                       // outer vertex (face corner)
        const P01 = Y[i];                       // side cut (CCW-next edge)
        for (let cu = 0; cu < CORNER_N; cu++) {
          for (let cv = 0; cv < CORNER_N; cv++) {
            const u0 = cu / CORNER_N, u1 = (cu + 1) / CORNER_N;
            const v0 = cv / CORNER_N, v1 = (cv + 1) / CORNER_N;
            const Q0 = bilerpV3(P00, P10, P11, P01, u0, v0);
            const Q1 = bilerpV3(P00, P10, P11, P01, u1, v0);
            const Q2 = bilerpV3(P00, P10, P11, P01, u1, v1);
            const Q3 = bilerpV3(P00, P10, P11, P01, u0, v1);
            const cell = makeQuadPiece(
              Q0, Q1, Q2, Q3,
              n,
              cornerMat,
              {
                type: 'diamond',
                // All 9 cells share `face` → validatePolyhedralFaces enforces
                // 1–9 uniqueness per corner (sudoku 3×3 box).
                face: faceIdx * 1000 + 500 + i,
                faceReal: faceIdx,
                cornerIdx: i,
                cellU: cu,
                cellV: cv,
                // Edge-side midpoints for cross-face row chaining (rowEdgeI:
                // row of constant cellU, ends on face edge i; rowEdgeIm1:
                // row of constant cellV, ends on face edge i-1).
                rowEndI:    lerpV3(P01, P11, (cu + 0.5) / CORNER_N),
                rowEndIm1:  lerpV3(P10, P11, (cv + 0.5) / CORNER_N),
              },
            );
            group.add(cell);
            pieces.push(cell);
          }
        }
      }

      faceIdx++;
    }
  }

  // Merge diamond CELLS that share a full edge across a dodecahedron edge
  // into one physical piece (every boundary cell is shared by 2 faces). The
  // generic mergeSiblingsByPolyhedronEdge keys on POLY_KEY (×1000 rounding)
  // and float error from the world-matrix transforms silently drops ~46 of
  // the boundary pairs, so clicking such a cell highlights only one face.
  // Here we union by the COARSE-rounded world midpoint of each cell edge:
  // an edge midpoint shared by cells of >1 face is a true cross-face seam.
  function mergeDiamondEdgesByMidpoint() {
    const diamonds = pieces.filter(p => p.userData.type === 'diamond');
    const a = new THREE.Vector3(), b = new THREE.Vector3(), mid = new THREE.Vector3();
    const midKey = v => `${Math.round(v.x * 100)},${Math.round(v.y * 100)},${Math.round(v.z * 100)}`;
    const byMid = new Map();
    for (const c of diamonds) {
      c.updateMatrixWorld(true);
      const pos = c.geometry.getAttribute('position');
      const n = pos.count;
      for (let i = 0; i < n; i++) {
        a.fromBufferAttribute(pos, i).applyMatrix4(c.matrixWorld);
        b.fromBufferAttribute(pos, (i + 1) % n).applyMatrix4(c.matrixWorld);
        mid.addVectors(a, b).multiplyScalar(0.5);
        const k = midKey(mid);
        if (!byMid.has(k)) byMid.set(k, []);
        byMid.get(k).push(c);
      }
    }
    for (const list of byMid.values()) {
      const faces = new Set(list.map(c => c.userData.faceReal));
      if (faces.size < 2) continue; // same-face interior edge → not a seam
      // Fuse the sibling sets of every cell meeting on this cross-face edge.
      const merged = [];
      const seen = new Set();
      for (const c of list) {
        const sibs = (c.userData.siblings && c.userData.siblings.length) ? c.userData.siblings : [c];
        for (const s of sibs) { if (!seen.has(s)) { seen.add(s); merged.push(s); } }
      }
      for (const s of merged) s.userData.siblings = merged;
      let val = 0, given = false;
      for (const m of merged) {
        if (m.userData.value) { val = m.userData.value; given = !!m.userData.isGiven; break; }
      }
      if (val) for (const m of merged) setPieceDigit(m, val, given);
    }
  }

  // Merge the three corner-TIP cells that meet at each dodecahedron vertex
  // into one physical piece (a real corner piece has 3 stickers). The
  // generic edge-merge only unions pieces sharing a full edge (2 vertices);
  // the outermost diamond cell of each corner touches its two neighbours
  // only at the single polyhedron vertex, and POLY_KEY float-rounding lets a
  // few of those edge-unions slip, so we explicitly group the tips here by
  // the world position of their outer vertex (geometry vertex index 2 = O_i).
  function mergeCornerTipsByVertex() {
    const TIP = CORNER_N - 1;
    const tips = pieces.filter(p =>
      p.userData.type === 'diamond' &&
      p.userData.cellU === TIP && p.userData.cellV === TIP);
    const tmp = new THREE.Vector3();
    // Coarser rounding than POLY_KEY: dodeca vertices are far apart (>1 unit),
    // so 0.01 resolution reliably clusters the 3 coincident tips per vertex.
    const vertKey = v => `${Math.round(v.x * 100)},${Math.round(v.y * 100)},${Math.round(v.z * 100)}`;
    const byVert = new Map();
    for (const c of tips) {
      c.updateMatrixWorld(true);
      const pos = c.geometry.getAttribute('position');
      tmp.fromBufferAttribute(pos, 2).applyMatrix4(c.matrixWorld); // vertex 2 = O_i
      const k = vertKey(tmp);
      if (!byVert.has(k)) byVert.set(k, []);
      byVert.get(k).push(c);
    }
    for (const list of byVert.values()) {
      if (list.length < 2) continue;
      // Fuse the existing sibling sets of every tip meeting here.
      const merged = [];
      const seen = new Set();
      for (const c of list) {
        const sibs = (c.userData.siblings && c.userData.siblings.length) ? c.userData.siblings : [c];
        for (const s of sibs) { if (!seen.has(s)) { seen.add(s); merged.push(s); } }
      }
      for (const s of merged) s.userData.siblings = merged;
      // Propagate any digit already set so the linked stickers agree.
      let val = 0, given = false;
      for (const m of merged) {
        if (m.userData.value) { val = m.userData.value; given = !!m.userData.isGiven; break; }
      }
      if (val) for (const m of merged) setPieceDigit(m, val, given);
    }
  }

  // In-face row constraints (rowConstraints opt). Along each pentagon edge i
  // the two corner boxes that flank it (box i near vertex O_i and box i+1
  // near vertex O_{i+1}) are separated by the blocked edge strip. At each
  // depth d from the edge (d = 0 inner … CORNER_N-1 on the edge) box i's
  // cell-row cellV=d and box i+1's cell-column cellU=d are collinear and form
  // one straight line crossing that blocked strip:
  //   O_i …[box i: 3 cells]… Y_i —[hidden strip]— X_i …[box i+1: 3 cells]… O_{i+1}
  // Each such 6-cell line must hold 6 distinct digits.
  // CORNER_N depths × 5 edges × 12 faces.
  function buildRowGroups() {
    // Bucket diamond cells by (faceReal, cornerIdx).
    const byCorner = new Map();
    const faces = new Set();
    for (const p of pieces) {
      if (p.userData.type !== 'diamond') continue;
      faces.add(p.userData.faceReal);
      const k = `${p.userData.faceReal}|${p.userData.cornerIdx}`;
      if (!byCorner.has(k)) byCorner.set(k, []);
      byCorner.get(k).push(p);
    }
    for (const face of faces) {
      for (let i = 0; i < 5; i++) {
        const boxA = byCorner.get(`${face}|${i}`) || [];
        const boxB = byCorner.get(`${face}|${(i + 1) % 5}`) || [];
        for (let d = 0; d < CORNER_N; d++) {
          const rowCells = [];
          for (const c of boxA) if (c.userData.cellV === d) rowCells.push(c); // box i row at depth d
          for (const c of boxB) if (c.userData.cellU === d) rowCells.push(c); // box i+1 column at depth d
          if (rowCells.length === 0) continue;
          const tag = `R:${face}:${i}:${d}`;
          for (const c of rowCells) {
            if (!c.userData.extraFaces) c.userData.extraFaces = [];
            if (!c.userData.extraFaces.includes(tag)) c.userData.extraFaces.push(tag);
          }
        }
      }
    }
  }

  // Solvable givens. Corner-box diamond cells share a `face` ID per corner
  // (one 1–9 sudoku box); edge strips and centers each carry a unique
  // `face` ID so they're trivially satisfied as single-cell groups.
  function seedGivens() {
    givenCount = 0;
    // With row constraints the puzzle is fully solvable, so forbid
    // forced-empty cells — every corner box must contain all 9 digits.
    const solved = Sudoku.solvePolyhedral(pieces, {
      faceField: 'face',
      allowForcedEmpty: !rowConstraints,
      deadlineMs: rowConstraints ? 4000 : 250,
    });
    const seen = new Set();
    for (const p of pieces) {
      if (seen.has(p)) continue;
      const sibs = p.userData.siblings && p.userData.siblings.length ? p.userData.siblings : [p];
      for (const s of sibs) seen.add(s);
      const val = solved.get(p) | 0;
      if (val === 0) continue;
      // Per-type reveal rates: corner boxes get the regular density;
      // decorative strips/centers reveal less often for visual breathing room.
      const reveal = (p.userData.type === 'diamond') ? GIVEN_PROBABILITY * 1.6 : 0.35;
      if (RNG.random() >= reveal) continue;
      for (const m of sibs) setPieceDigit(m, val, true);
      givenCount++;
    }
  }

  const api = {
    name,
    subtitle,
    controlsHTML:
      '<kbd>left-click</kbd> select &nbsp; <kbd>1</kbd>–<kbd>9</kbd> fill &nbsp; <kbd>0</kbd>/<kbd>⌫</kbd> clear<br>' +
      '<kbd>right-drag</kbd> rotate &nbsp; <kbd>scroll</kbd> zoom',
    cameraDistance: 9,
    install() { build(); mergeSiblingsByPolyhedronEdge(pieces); mergeDiamondEdgesByMidpoint(); mergeCornerTipsByVertex(); if (rowConstraints) buildRowGroups(); seedGivens(); validatePolyhedralFaces(pieces); scene.add(group); },
    uninstall() { scene.remove(group); disposeGroup(group); group = null; pieces = []; selectedSticker = null; selected = null; },
    get pickables() { return pieces; },
    pick(hit) {
      if (selected) for (const m of selected) {
        m.material.emissive.setHex(0x000000); m.material.emissiveIntensity = 1;
      }
      selectedSticker = hit ? hit.object : null;
      selected = hit ? hit.object.userData.siblings : null;
      if (selected) for (const m of selected) {
        m.material.emissive = new THREE.Color(0xffd166);
        m.material.emissiveIntensity = 0.30;
      }
      refreshSelected();
    },
    clearPick() { this.pick(null); },
    keydown(e) {
      return handleDigitKey(e, {
        getTarget: () => selectedSticker,
        onChange: (piece, value) => {
          const prev = piece.userData.value;
          for (const sib of piece.userData.siblings) setPieceDigit(sib, value, false);
          if (prev === 0 && value !== 0) userEntries++;
          else if (prev !== 0 && value === 0) userEntries--;
          validatePolyhedralFaces(pieces);
          refreshSelected();
          statsEl.innerHTML = api.statsHTML();
        },
      });
    },
    frame() { updatePolyhedralDigits(pieces, group, camera); },
    selectedInfoHTML() {
      if (!selected) return 'No piece selected';
      const ud = selectedSticker.userData;
      let v;
      if (ud.value === 0)   v = '<span class="dim">empty</span>';
      else if (ud.isGiven)  v = `<span class="given">${ud.value}</span> <span class="dim">(given)</span>`;
      else                  v = `<span class="user">${ud.value}</span>`;
      const typeLabel =
        ud.type === 'center'    ? 'Center'         :
        ud.type === 'trapezoid' ? 'Edge strip'     :
        ud.type === 'diamond'   ? 'Corner cell'    : 'Piece';
      const detail =
        ud.type === 'center'    ? '' :
        ud.type === 'trapezoid' ? `<span class="dim">Edge ${ud.edgeIdx + 1}/5 · strip ${ud.strip + 1}/3 (tapering outward)</span><br>` :
                                  `<span class="dim">Corner ${ud.cornerIdx + 1}/5 · cell (${ud.cellU + 1},${ud.cellV + 1}) of 3×3 sudoku box</span><br>`;
      return `<b>Selected piece</b> <span class="pill quad">${typeLabel}</span><br>` +
             `<span class="dim">Face</span> ${ud.faceReal + 1} <span class="dim">/ 12</span><br>` +
             detail +
             `<span class="dim">Piece value</span> ${v}`;
    },
    statsHTML() {
      const total = blockInner
        ? '<span class="dim">pieces/face</span> <span class="stat-num">55</span> <span class="dim">(5×2 + 5×9, center + inner ring blocked)</span><br>'
        : '<span class="dim">pieces/face</span> <span class="stat-num">61</span> <span class="dim">(1 + 5×3 + 5×9)</span><br>';
      return `<span class="dim">faces</span> <span class="stat-num">12</span> <span class="dim">pentagons</span><br>` +
             total +
             `<span class="dim">total pieces</span> <span class="stat-num">${pieces.length}</span><br>` +
             `<span class="dim">given clues</span> <span class="stat-num">${givenCount}</span><br>` +
             `<span class="dim">your entries</span> <span class="stat-num">${userEntries}</span>`;
    },
  };
  return api;
}
