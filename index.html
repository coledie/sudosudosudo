<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sudoku Polyhedra</title>
<style>
  body {
    margin: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #1e1640 0%, #0c0a20 45%, #050410 100%);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    color: #e8e8f0;
  }
  .panel {
    position: absolute;
    padding: 12px 16px;
    background: rgba(12, 10, 24, 0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    user-select: none;
    font-size: 13px; line-height: 1.55;
  }
  #info     { top: 16px;    left: 16px; max-width: 360px; }
  #stats    { top: 16px;    right: 16px; text-align: right; min-width: 150px; }
  #selected { bottom: 16px; left: 16px;  min-width: 240px; }
  b { color: #ffd166; font-weight: 600; letter-spacing: 0.02em; }
  kbd {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 2px 7px; border-radius: 5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; color: #e8e8f0;
  }
  .dim { opacity: 0.6; }
  .given { color: #ffd166; }
  .user  { color: #7fbfff; }
  .stat-num { font-size: 18px; font-weight: 600; color: #ffd166; }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .pill.cell    { background: rgba(127,191,255,0.20); color: #bfe0ff; }
  .pill.center  { background: rgba(212,167,102,0.20); color: #f0c98a; }
  .pill.edge    { background: rgba(106,127,200,0.20); color: #aebef5; }
  .pill.corner  { background: rgba(159,118,224,0.22); color: #cbb0f8; }
  .pill.kite    { background: rgba(102,200,167,0.20); color: #8feac0; }

  /* Shape navigator header inside #info */
  .nav {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 6px;
  }
  .nav .title {
    flex: 1; text-align: center;
    font-size: 15px; font-weight: 700; letter-spacing: 0.02em;
    color: #ffd166;
    cursor: pointer; user-select: none;
    padding: 2px 6px; border-radius: 6px;
    transition: background 0.15s;
  }
  .nav .title:hover { background: rgba(255,209,102,0.10); }
  .nav .title .variant {
    display: block;
    font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
    color: rgba(255,209,102,0.55);
    margin-top: 1px;
    text-transform: uppercase;
  }
  .nav button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8e8f0;
    width: 28px; height: 28px;
    border-radius: 8px;
    font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.08s;
  }
  .nav button:hover  { background: rgba(255,255,255,0.14); }
  .nav button:active { transform: scale(0.92); }
  .nav .dots { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
  .nav .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    transition: background 0.2s;
    cursor: pointer;
  }
  .nav .dot.active { background: #ffd166; }
  .nav .dot.sep { width: 10px; background: transparent; cursor: default; }

  .seed-row {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px; font-size: 12px;
  }
  .seed-row label { opacity: 0.55; letter-spacing: 0.04em; text-transform: uppercase; font-size: 10px; }
  .seed-row input {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8e8f0; padding: 3px 7px; border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
  }
  .seed-row button {
    background: rgba(255,209,102,0.18); color: #ffd166;
    border: 1px solid rgba(255,209,102,0.35);
    padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 11px;
  }
  .seed-row button:hover { background: rgba(255,209,102,0.28); }

  canvas { display: block; }
</style>
</head>
<body>
<div id="info" class="panel">
  <div class="nav">
    <button id="navPrev" aria-label="Previous shape">◀</button>
    <div class="title" id="navTitle">—</div>
    <button id="navNext" aria-label="Next shape">▶</button>
  </div>
  <div class="dots" id="navDots"></div>
  <div class="seed-row">
    <label for="seedInput">Seed</label>
    <input id="seedInput" type="text" inputmode="numeric" autocomplete="off" />
    <button id="seedReroll" title="Random new seed">🎲</button>
  </div>
  <div id="infoBody" style="margin-top: 10px"></div>
</div>
<div id="stats" class="panel"></div>
<div id="selected" class="panel">No piece selected</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================================
//  SHARED SCENE / CAMERA / RENDERER / LIGHTING
// ============================================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

scene.add(new THREE.HemisphereLight(0xb8c4ff, 0x2a1f3a, 0.6));
const keyLight  = new THREE.DirectionalLight(0xffe4c0, 0.9); keyLight.position.set(8, 14, 12);  scene.add(keyLight);
const rimLight  = new THREE.DirectionalLight(0x88a8ff, 0.5); rimLight.position.set(-12, -2, -8); scene.add(rimLight);
const fillLight = new THREE.DirectionalLight(0xffb8d0, 0.25); fillLight.position.set(4, -10, 6); scene.add(fillLight);

// Every shape gets its own root group attached/detached on switch.
let activeShape = null;

// Resources tagged with keepAlive() survive `disposeGroup` (shared across
// shape switches: digit textures, the unit digit plane, outline/highlight mats).
const DISPOSE_BLACKLIST = new WeakSet();
function keepAlive(...resources) { for (const r of resources) DISPOSE_BLACKLIST.add(r); }

const infoBodyEl = document.getElementById('infoBody');
const statsEl    = document.getElementById('stats');
const selectedEl = document.getElementById('selected');
const navTitleEl = document.getElementById('navTitle');
const navDotsEl  = document.getElementById('navDots');

// ============================================================================
//  POLYHEDRAL HELPERS (shared by kilominx, megaminx, icosaminx)
// ============================================================================

// Extract the 12 (dodec) or 20 (icos) faces from a primitive's position buffer.
// Returns array of { normal, center, verts (sorted CCW around normal) }.
function extractPolyhedralFaces(sourceGeom, faceTol = 0.01) {
  const pos = sourceGeom.attributes.position;
  const idx = sourceGeom.index;
  const triCount = idx ? idx.count / 3 : pos.count / 3;
  const tris = [];
  for (let t = 0; t < triCount; t++) {
    const i0 = idx ? idx.getX(t * 3 + 0) : t * 3 + 0;
    const i1 = idx ? idx.getX(t * 3 + 1) : t * 3 + 1;
    const i2 = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
    const v0 = new THREE.Vector3().fromBufferAttribute(pos, i0);
    const v1 = new THREE.Vector3().fromBufferAttribute(pos, i1);
    const v2 = new THREE.Vector3().fromBufferAttribute(pos, i2);
    const n = new THREE.Vector3().subVectors(v1, v0)
                .cross(new THREE.Vector3().subVectors(v2, v0))
                .normalize();
    tris.push({ vs: [v0, v1, v2], n });
  }
  const faces = [];
  for (const t of tris) {
    let f = faces.find(ff => ff.normal.dot(t.n) > 1 - faceTol);
    if (!f) { f = { normal: t.n.clone(), tris: [] }; faces.push(f); }
    f.tris.push(t);
  }
  const KEY = v => `${v.x.toFixed(4)},${v.y.toFixed(4)},${v.z.toFixed(4)}`;
  for (const f of faces) {
    const vmap = new Map();
    for (const t of f.tris) for (const v of t.vs) {
      const k = KEY(v);
      if (!vmap.has(k)) vmap.set(k, v.clone());
    }
    const verts = Array.from(vmap.values());
    const center = new THREE.Vector3();
    for (const v of verts) center.add(v);
    center.multiplyScalar(1 / verts.length);
    const u0 = new THREE.Vector3().subVectors(verts[0], center).normalize();
    const w  = new THREE.Vector3().crossVectors(f.normal, u0);
    const ang = v => {
      const r = new THREE.Vector3().subVectors(v, center);
      return Math.atan2(r.dot(w), r.dot(u0));
    };
    verts.sort((a, b) => ang(a) - ang(b));
    f.verts = verts;
    f.center = center;
  }
  return faces;
}
const POLY_KEY = v => `${v.x.toFixed(4)},${v.y.toFixed(4)},${v.z.toFixed(4)}`;

// Link pieces that lie on opposite sides of a shared polyhedron edge (or that
// meet at a shared polyhedron vertex via two pairwise edge-shares) as
// siblings — so selecting one selects all, and a value typed into one
// propagates to the others. Pieces on the SAME face (matching faceReal) are
// never merged: only cross-face shares count.
//
// For each piece we collect its world-space vertex keys, then key every pair
// of those verts as a candidate shared edge. Two pieces sharing ≥1 such
// edge-pair across different faces are unioned. This catches both two-way
// edge twins (strips along a dihedral edge, edge cells across a face seam)
// and three-way corner triples (the apex cell at a polyhedron vertex shares
// a 2-vert edge with each of its two neighbour-face apex cells, chaining
// all 3 into one group via union-find).
function mergeSiblingsByPolyhedronEdge(pieces) {
  if (!pieces || pieces.length === 0) return;
  const tmp = new THREE.Vector3();
  const vertKeysOf = pieces.map(p => {
    p.updateMatrixWorld(true);
    const pos = p.geometry.getAttribute('position');
    const out = [];
    const seen = new Set();
    for (let i = 0; i < pos.count; i++) {
      tmp.fromBufferAttribute(pos, i).applyMatrix4(p.matrixWorld);
      const k = POLY_KEY(tmp);
      if (!seen.has(k)) { seen.add(k); out.push(k); }
    }
    return out;
  });
  const edgeMap = new Map();
  for (let i = 0; i < pieces.length; i++) {
    const ks = vertKeysOf[i];
    for (let a = 0; a < ks.length; a++) {
      for (let b = a + 1; b < ks.length; b++) {
        const ek = ks[a] < ks[b] ? ks[a] + '|' + ks[b] : ks[b] + '|' + ks[a];
        if (!edgeMap.has(ek)) edgeMap.set(ek, []);
        edgeMap.get(ek).push(i);
      }
    }
  }
  const parent = pieces.map((_, i) => i);
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
  for (const ids of edgeMap.values()) {
    if (ids.length < 2) continue;
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const fa = pieces[ids[i]].userData.faceReal;
        const fb = pieces[ids[j]].userData.faceReal;
        if (fa !== undefined && fb !== undefined && fa === fb) continue;
        union(ids[i], ids[j]);
      }
    }
  }
  const groups = new Map();
  for (let i = 0; i < pieces.length; i++) {
    const r = find(i);
    if (!groups.has(r)) groups.set(r, []);
    groups.get(r).push(pieces[i]);
  }
  for (const members of groups.values()) {
    if (members.length < 2) continue;
    for (const p of members) p.userData.siblings = members;
    // Propagate any value set during build (e.g. random givens) so all
    // newly-linked siblings show the same digit.
    let val = 0, given = false;
    for (const m of members) {
      if (m.userData.value) { val = m.userData.value; given = !!m.userData.isGiven; break; }
    }
    if (val) for (const m of members) setPieceDigit(m, val, given);
  }
}

// Quad-strip outline around a closed polygon (2D points in face plane).
function makeOutlineGeom(pts2d, halfW, lift) {
  const pos = [], idx = [];
  let vi = 0;
  for (let i = 0; i < pts2d.length; i++) {
    const a = pts2d[i], b = pts2d[(i + 1) % pts2d.length];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len * halfW, ny = dx / len * halfW;
    pos.push(
      a[0] + nx, a[1] + ny, lift,
      a[0] - nx, a[1] - ny, lift,
      b[0] + nx, b[1] + ny, lift,
      b[0] - nx, b[1] - ny, lift,
    );
    idx.push(vi, vi + 1, vi + 2,  vi + 1, vi + 3, vi + 2);
    vi += 4;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setIndex(idx);
  return g;
}

// Centroid-shrunk LineSegments loop — selection highlight.
function makeHighlightGeom(pts2d, shrink, lift) {
  let cx = 0, cy = 0;
  for (const p of pts2d) { cx += p[0]; cy += p[1]; }
  cx /= pts2d.length; cy /= pts2d.length;
  const sp = pts2d.map(p => [cx + (p[0] - cx) * (1 - shrink), cy + (p[1] - cy) * (1 - shrink)]);
  const pos = [];
  for (let i = 0; i < sp.length; i++) {
    const a = sp[i], b = sp[(i + 1) % sp.length];
    pos.push(a[0], a[1], lift, b[0], b[1], lift);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  return g;
}

const POLY_OUTLINE_MAT = new THREE.MeshBasicMaterial({
  color: 0x07060f, side: THREE.DoubleSide,
  polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
});
const POLY_HL_MAT = new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.95 });
keepAlive(POLY_OUTLINE_MAT, POLY_HL_MAT);

// Dispose all materials/geometries reachable from a group (best-effort).
// Resources registered via keepAlive() are shared across shape switches and
// must survive an uninstall (digit textures, the unit digit plane geom,
// the shared outline/highlight materials, etc.).
function disposeGroup(group) {
  group.traverse(obj => {
    if (obj.geometry && !DISPOSE_BLACKLIST.has(obj.geometry)) obj.geometry.dispose();
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      for (const m of mats) {
        if (DISPOSE_BLACKLIST.has(m)) continue;
        if (m.map && !DISPOSE_BLACKLIST.has(m.map)) m.map.dispose();
        m.dispose();
      }
    }
  });
}

// ============================================================================
//  SHARED DIGIT MODULE  (used by every shape)
//  Generates 1-9 sprite textures once, exposes plane materials + a builder
//  helper, plus a per-frame "rotate digits to face camera-up" utility.
// ============================================================================
const GIVEN_PROBABILITY = 0.30;

function makeNumberSpriteTexture(num, color) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.shadowColor = 'rgba(0, 0, 0, 0.55)';
  g.shadowBlur = 8;
  g.shadowOffsetY = 2;
  g.fillStyle = color;
  g.font = '800 96px "SF Pro Display", -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(String(num), 64, 70);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
const DIGIT_GIVEN_MATS    = {};
const DIGIT_USER_MATS     = {};
const DIGIT_CONFLICT_MATS = {};
for (let n = 1; n <= 9; n++) {
  DIGIT_GIVEN_MATS[n] = new THREE.MeshBasicMaterial({
    map: makeNumberSpriteTexture(n, '#fff2c8'), transparent: true, depthWrite: false,
  });
  DIGIT_USER_MATS[n] = new THREE.MeshBasicMaterial({
    map: makeNumberSpriteTexture(n, '#bfe0ff'), transparent: true, depthWrite: false,
  });
  DIGIT_CONFLICT_MATS[n] = new THREE.MeshBasicMaterial({
    map: makeNumberSpriteTexture(n, '#ff7066'), transparent: true, depthWrite: false,
  });
}
const _unitDigitGeom = new THREE.PlaneGeometry(1, 1);
keepAlive(_unitDigitGeom);
for (let n = 1; n <= 9; n++) {
  keepAlive(DIGIT_GIVEN_MATS[n],    DIGIT_GIVEN_MATS[n].map);
  keepAlive(DIGIT_USER_MATS[n],     DIGIT_USER_MATS[n].map);
  keepAlive(DIGIT_CONFLICT_MATS[n], DIGIT_CONFLICT_MATS[n].map);
}

function _pickDigitMatSet(isGiven, isConflict) {
  if (isConflict) return DIGIT_CONFLICT_MATS;
  return isGiven ? DIGIT_GIVEN_MATS : DIGIT_USER_MATS;
}

// Make a digit plane mesh (size in world units). `value` is 1..9; isGiven picks color.
function makeDigitPlane(value, isGiven, size) {
  const mat = (isGiven ? DIGIT_GIVEN_MATS : DIGIT_USER_MATS)[value];
  const m = new THREE.Mesh(_unitDigitGeom, mat);
  m.scale.set(size, size, 1);
  m.renderOrder = 3;
  return m;
}

// ---- helpers for the polyhedral shapes (digit attached at template 2D centroid) ----
function centroidOf2D(pts) {
  let cx = 0, cy = 0;
  for (const p of pts) { cx += p[0]; cy += p[1]; }
  return [cx / pts.length, cy / pts.length];
}
// Returns an inscribed plane size based on min distance from centroid to any vertex.
function fitDigitSize(pts, frac = 0.85) {
  const [cx, cy] = centroidOf2D(pts);
  let minR = Infinity;
  for (const p of pts) {
    const r = Math.hypot(p[0] - cx, p[1] - cy);
    if (r < minR) minR = r;
  }
  return minR * frac;
}

// Each polyhedral piece carries: { value, isGiven, digit, digitLocal:{x,y,size} }.
// Attach a digit plane at (x, y) local to the piece, lifted just above the face.
const _DIGIT_LIFT = 0.012;
function setPieceDigit(piece, value, isGiven, isConflict = false) {
  if (piece.userData.digit) {
    piece.remove(piece.userData.digit);
    piece.userData.digit = null;
  }
  piece.userData.value      = value;
  piece.userData.isGiven    = isGiven;
  piece.userData.isConflict = isConflict;
  if (value === 0 || value == null) return;
  const { x, y, size } = piece.userData.digitLocal;
  const matSet = _pickDigitMatSet(isGiven, isConflict);
  const m = new THREE.Mesh(_unitDigitGeom, matSet[value]);
  m.scale.set(size, size, 1);
  m.renderOrder = 3;
  m.position.set(x, y, _DIGIT_LIFT);
  piece.add(m);
  piece.userData.digit = m;
}

// Per-face uniqueness check for polyhedral shapes (megaminx, icosaminx).
// Rule: no duplicate non-zero digit among the pieces lying on the same face.
// Givens stay styled as given even when conflicting; only user entries paint red.
function validatePolyhedralFaces(pieces) {
  const byFace = new Map();
  for (const p of pieces) {
    const fids = [p.userData.face];
    if (p.userData.extraFaces) for (const f of p.userData.extraFaces) fids.push(f);
    for (const f of fids) {
      if (!byFace.has(f)) byFace.set(f, []);
      byFace.get(f).push(p);
    }
  }
  const conflicts = new Set();
  for (const list of byFace.values()) {
    const seen = new Map();
    const sibSeen = new Set(); // dedupe sibling groups within a face/chain
    for (const p of list) {
      const sibKey = (p.userData.siblings && p.userData.siblings.length)
        ? p.userData.siblings[0] : p;
      if (sibSeen.has(sibKey)) continue;
      sibSeen.add(sibKey);
      const v = p.userData.value;
      if (!v) continue;
      if (!seen.has(v)) seen.set(v, []);
      seen.get(v).push(p);
    }
    for (const dups of seen.values()) {
      if (dups.length > 1) for (const p of dups) conflicts.add(p);
    }
  }
  for (const p of pieces) {
    const shouldFlag = !p.userData.isGiven && p.userData.value !== 0 && conflicts.has(p);
    if (!!p.userData.isConflict !== shouldFlag) {
      setPieceDigit(p, p.userData.value, p.userData.isGiven, shouldFlag);
    }
  }
}

// Each quad piece carries userData.row, userData.col (both 0..8) defining
// its position inside a 9×9 sudoku grid local to its wedge. Validation:
// rows, columns, and 3×3 sub-blocks within each wedge must each have
// unique non-zero digits.
function validateWedge9x9Sudoku(pieces) {
  const byWedge = new Map();
  for (const p of pieces) {
    if (p.userData.type !== 'quad') continue;
    const w = p.userData.face;
    if (!byWedge.has(w)) byWedge.set(w, []);
    byWedge.get(w).push(p);
  }
  const conflicts = new Set();
  for (const list of byWedge.values()) {
    const grid = Array.from({ length: 9 }, () => Array(9).fill(null));
    for (const p of list) grid[p.userData.row][p.userData.col] = p;
    const flag = (group) => {
      const seen = new Map();
      for (const p of group) {
        if (!p) continue;
        const v = p.userData.value;
        if (!v) continue;
        if (!seen.has(v)) seen.set(v, []);
        seen.get(v).push(p);
      }
      for (const dups of seen.values()) {
        if (dups.length > 1) for (const p of dups) conflicts.add(p);
      }
    };
    for (let r = 0; r < 9; r++) flag(grid[r]);
    for (let c = 0; c < 9; c++) flag(grid.map(row => row[c]));
    for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {
      const blk = [];
      for (let dr = 0; dr < 3; dr++) for (let dc = 0; dc < 3; dc++) {
        blk.push(grid[br * 3 + dr][bc * 3 + dc]);
      }
      flag(blk);
    }
  }
  for (const p of pieces) {
    if (p.userData.type !== 'quad') continue;
    const shouldFlag = !p.userData.isGiven && p.userData.value !== 0 && conflicts.has(p);
    if (!!p.userData.isConflict !== shouldFlag) {
      setPieceDigit(p, p.userData.value, p.userData.isGiven, shouldFlag);
    }
  }
}

// Per-frame: rotate every piece's digit plane so its +Y aligns with the
// camera's up vector, projected into the piece's local face plane (XY).
const _camUpWorld = new THREE.Vector3();
const _localUp    = new THREE.Vector3();
const _invMat     = new THREE.Matrix4();
function updatePolyhedralDigits(pieces, group, camera) {
  if (!group) return;
  group.updateMatrixWorld(true);
  _camUpWorld.set(0, 1, 0).applyQuaternion(camera.quaternion);
  for (const p of pieces) {
    const d = p.userData.digit;
    if (!d) continue;
    _invMat.copy(p.matrixWorld).invert();
    _localUp.copy(_camUpWorld).transformDirection(_invMat);
    d.rotation.z = Math.atan2(_localUp.y, _localUp.x) - Math.PI / 2;
  }
}

// Shared digit-key handler for polyhedral shapes. Returns true if consumed.
//   ctx = { getTarget, onChange }  where getTarget() returns the editable piece (or null)
function handleDigitKey(e, ctx) {
  const k = e.key;
  const t = ctx.getTarget();
  if (!t || t.userData.isGiven) {
    // Still consume the key to avoid surprise behavior, but only if it's a digit key.
    if ((k >= '0' && k <= '9') || k === 'Backspace' || k === 'Delete') {
      e.preventDefault(); return true;
    }
    return false;
  }
  if (k >= '1' && k <= '9') {
    ctx.onChange(t, parseInt(k));
    e.preventDefault(); return true;
  }
  if (k === '0' || k === 'Backspace' || k === 'Delete') {
    ctx.onChange(t, 0);
    e.preventDefault(); return true;
  }
  return false;
}

// ============================================================================
//  SEEDABLE RNG  (Mulberry32 — fast, deterministic, good distribution)
//  Any code that wants reproducible-per-seed output calls RNG.random()
//  instead of Math.random(). Generation paths re-seed at the start of every
//  shape install via RNG.reset(), so (currentSeed, shapeIndex) → same board.
// ============================================================================
const RNG = (() => {
  let state = 1;
  let savedSeed = 1;
  function rand() {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function hashString(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  return {
    random: rand,
    // Set the active seed (and remember it so reset() returns to the same point).
    set(seed) {
      if (typeof seed === 'string') {
        const n = Number(seed);
        seed = Number.isFinite(n) ? (n >>> 0) : hashString(seed);
      }
      seed = (seed >>> 0) || 1;
      savedSeed = seed;
      state = seed;
    },
    // Re-seed state back to the saved seed (called before every shape build()).
    reset() { state = savedSeed; },
    get seed() { return savedSeed; },
  };
})();
RNG.set(1);


// ============================================================================
//  SUDOKU CSP SOLVER  (used by every shape's board generator)
//
//  Generic constraint-satisfaction core: variables hold integers from
//  `alphabet`; each `group` (array of var IDs) must contain DISTINCT values
//  (the same "no duplicate digit in this region" rule every validator uses).
//
//  `solve()` returns an array of length `numVars` where each entry is either
//  a value from the alphabet or 0 ("left empty"). Cells are forced empty
//  only when their domain is exhausted (e.g. an 11-cell group with a
//  9-symbol alphabet: 2 cells must end up empty). This makes the same
//  algorithm work for both fully-fillable shapes (cubes, wedges, corners)
//  and pigeonhole-blocked shapes (megaminx face: 11 stickers, 9 digits).
//
//  Randomized MRV + shuffled value ordering gives a different valid board
//  every run with backtracking only when needed. For our shapes the typical
//  decomposition is many small independent groups so this finishes instantly.
// ============================================================================
const Sudoku = (() => {
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(RNG.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Solve `numVars` cells over `alphabet` such that each group has distinct
  // values. Returns int[numVars] (0 = unassigned/forced-empty).
  // `deadlineMs` aborts long solves and returns the current best-effort
  // assignment (some 0s may remain) so the UI never freezes.
  function solve(numVars, alphabet, groups, opts = {}) {
    const { deadlineMs = 250, allowForcedEmpty = true } = opts;
    const assignment = new Array(numVars).fill(null); // null = untouched

    // For each var, which groups contain it.
    const varGroups = Array.from({ length: numVars }, () => []);
    groups.forEach((g, gi) => { for (const v of g) varGroups[v].push(gi); });

    // Per-group live "used" sets.
    const used = groups.map(() => new Set());

    const domainOf = (v) => {
      const out = [];
      for (const x of alphabet) {
        let ok = true;
        for (const gi of varGroups[v]) if (used[gi].has(x)) { ok = false; break; }
        if (ok) out.push(x);
      }
      return out;
    };

    const t0 = (typeof performance !== 'undefined') ? performance.now() : Date.now();
    const deadline = t0 + deadlineMs;

    function step() {
      if (((typeof performance !== 'undefined') ? performance.now() : Date.now()) > deadline) {
        return 'timeout';
      }
      // MRV: smallest live domain among unassigned vars.
      let pick = -1, pickDom = null;
      for (let v = 0; v < numVars; v++) {
        if (assignment[v] !== null) continue;
        const d = domainOf(v);
        if (pick === -1 || d.length < pickDom.length) { pick = v; pickDom = d; }
        if (d.length === 0) break; // forced-empty cell — handle now
      }
      if (pick === -1) return true;
      if (pickDom.length === 0) {
        // Cell has no legal value. For pigeonhole-blocked shapes we accept a
        // forced-empty (0) here; otherwise treat it as a dead-end and
        // backtrack so fully-fillable shapes never leave incomplete regions.
        if (!allowForcedEmpty) return false;
        assignment[pick] = 0;
        const r = step();
        if (r === true || r === 'timeout') return r;
        assignment[pick] = null;
        return false;
      }
      shuffle(pickDom);
      for (const x of pickDom) {
        assignment[pick] = x;
        for (const gi of varGroups[pick]) used[gi].add(x);
        const r = step();
        if (r === true || r === 'timeout') return r;
        for (const gi of varGroups[pick]) used[gi].delete(x);
      }
      assignment[pick] = null;
      return false;
    }

    step();
    return assignment.map(v => (v == null ? 0 : v));
  }

  // -------- Adapter for polyhedral/wedge shapes --------
  // Groups pieces by sibling-set (one CSP variable per sibling group), then
  // builds one constraint group per unique value of `userData[faceField]`
  // among those siblings. Returns Map<piece, assignedValue> (0 = empty).
  function solvePolyhedral(pieces, { faceField = 'face', extraFacesField = 'extraFaces', deadlineMs = 250, allowForcedEmpty = true } = {}) {
    const seen = new Set();
    const vars = []; // each: { siblings: [], faces: Set }
    for (const p of pieces) {
      if (seen.has(p)) continue;
      const sibs = (p.userData.siblings && p.userData.siblings.length) ? p.userData.siblings : [p];
      for (const s of sibs) seen.add(s);
      const fset = new Set();
      for (const s of sibs) {
        fset.add(s.userData[faceField]);
        const extra = s.userData[extraFacesField];
        if (extra) for (const f of extra) fset.add(f);
      }
      vars.push({ siblings: sibs, faces: fset });
    }
    const faceToGroup = new Map();
    const groups = [];
    vars.forEach((v, vi) => {
      for (const f of v.faces) {
        let gi = faceToGroup.get(f);
        if (gi === undefined) { gi = groups.length; faceToGroup.set(f, gi); groups.push([]); }
        groups[gi].push(vi);
      }
    });
    const alphabet = [1,2,3,4,5,6,7,8,9];
    const assn = solve(vars.length, alphabet, groups, { deadlineMs, allowForcedEmpty });
    const out = new Map();
    for (let i = 0; i < vars.length; i++) {
      const val = assn[i];
      for (const p of vars[i].siblings) out.set(p, val);
    }
    return out;
  }

  // -------- Adapter for cube shells (per-face row/col/box sudoku) --------
  // grid is the [i][j][k] -> mesh (or null) lookup; FACE_DIRS is the cube's
  // 6-face descriptor array; N is the side length; blockSize = sqrt(N).
  // Returns Map<cube, assignedValue> (0 = empty).
  function solveCubeShell(allCubes, grid, FACE_DIRS, N, blockSize, opts = {}) {
    const idx = new Map(allCubes.map((c, i) => [c, i]));
    const groups = [];
    for (const f of FACE_DIRS) {
      const fixed = f.sign > 0 ? N - 1 : 0;
      const grid2d = [];
      for (let u = 0; u < N; u++) {
        const row = [];
        for (let v = 0; v < N; v++) {
          let i, j, k;
          if      (f.axis === 'x') { i = fixed; j = u;     k = v; }
          else if (f.axis === 'y') { i = u;     j = fixed; k = v; }
          else                     { i = u;     j = v;     k = fixed; }
          row.push(grid[i][j][k]);
        }
        grid2d.push(row);
      }
      // 1 row + 1 col + 1 box constraint per line/block (filtering null cubies).
      for (let u = 0; u < N; u++) {
        const g = [];
        for (let v = 0; v < N; v++) if (grid2d[u][v]) g.push(idx.get(grid2d[u][v]));
        if (g.length > 1) groups.push(g);
      }
      for (let v = 0; v < N; v++) {
        const g = [];
        for (let u = 0; u < N; u++) if (grid2d[u][v]) g.push(idx.get(grid2d[u][v]));
        if (g.length > 1) groups.push(g);
      }
      for (let bu = 0; bu < blockSize; bu++) for (let bv = 0; bv < blockSize; bv++) {
        const g = [];
        for (let du = 0; du < blockSize; du++) for (let dv = 0; dv < blockSize; dv++) {
          const c = grid2d[bu * blockSize + du][bv * blockSize + dv];
          if (c) g.push(idx.get(c));
        }
        if (g.length > 1) groups.push(g);
      }
    }
    const alphabet = []; for (let v = 1; v <= N; v++) alphabet.push(v);
    const assn = solve(allCubes.length, alphabet, groups, opts);
    const out = new Map();
    for (let i = 0; i < allCubes.length; i++) out.set(allCubes[i], assn[i]);
    return out;
  }

  return { solve, solvePolyhedral, solveCubeShell };
})();


// ============================================================================
//  SHAPE FRAMEWORK
//  Each shape exposes:
//    name, subtitle, controlsHTML
//    install(scene)                 — builds + adds its root group to the scene
//    uninstall()                    — removes + disposes its root group
//    pickables                      — array of meshes the raycaster targets
//    pick(intersection)             — handle a successful pick
//    clearPick()                    — deselect (e.g. on shape switch)
//    selectedInfoHTML()             — fills #selected
//    statsHTML()                    — fills #stats
//    keydown?(e)                    — optional keyboard handler
//    frame?(dt, t)                  — optional per-frame animation
//    cameraDistance                 — default camera Z
//    onResetSelection?()            — fired when shape becomes active
// ============================================================================

function refreshPanels() {
  if (!activeShape) return;
  const sameGroup = shapesInGroup(activeShape.group);
  const pos = sameGroup.indexOf(activeShapeIndex);
  const variantTxt = sameGroup.length > 1
    ? `<span class="variant">${activeShape.group} · ${pos + 1} / ${sameGroup.length} · click to cycle</span>`
    : '';
  navTitleEl.innerHTML = `${activeShape.name}${variantTxt}`;
  infoBodyEl.innerHTML =
    `<span class="dim">${activeShape.subtitle}</span><br><br>${activeShape.controlsHTML}`;
  statsEl.innerHTML = activeShape.statsHTML();
  refreshSelected();
  refreshDots();
}
function refreshSelected() {
  selectedEl.innerHTML = activeShape ? activeShape.selectedInfoHTML() : 'No selection';
}
function refreshDots() {
  const parts = [];
  let prevGroup = null;
  SHAPES.forEach((s, i) => {
    if (prevGroup !== null && s.group !== prevGroup) {
      parts.push('<div class="dot sep"></div>');
    }
    parts.push(
      `<div class="dot${i === activeShapeIndex ? ' active' : ''}" data-idx="${i}" title="${s.name}"></div>`,
    );
    prevGroup = s.group;
  });
  navDotsEl.innerHTML = parts.join('');
}

function shapesInGroup(group) {
  const out = [];
  for (let i = 0; i < SHAPES.length; i++) {
    if (SHAPES[i].group === group) out.push(i);
  }
  return out;
}
function cycleWithinGroup(dir = 1) {
  const grp = activeShape && activeShape.group;
  if (!grp) return;
  const members = shapesInGroup(grp);
  if (members.length < 2) return;
  const pos = members.indexOf(activeShapeIndex);
  const next = members[(pos + dir + members.length) % members.length];
  switchToShape(next);
}
// Ordered list of unique groups, in registration order.
function groupOrder() {
  const seen = new Set(), order = [];
  for (const s of SHAPES) {
    if (!seen.has(s.group)) { seen.add(s.group); order.push(s.group); }
  }
  return order;
}
// Jump to the first shape of the next/prev group (wraps).
function switchGroup(dir = 1) {
  const order = groupOrder();
  if (order.length === 0) return;
  const curGroup = activeShape && activeShape.group;
  const idx = order.indexOf(curGroup);
  const next = order[((idx + dir) % order.length + order.length) % order.length];
  const members = shapesInGroup(next);
  if (members.length) switchToShape(members[0]);
}

function switchToShape(index) {
  if (activeShape) activeShape.uninstall();
  activeShapeIndex = ((index % SHAPES.length) + SHAPES.length) % SHAPES.length;
  activeShape = SHAPES[activeShapeIndex];
  // Re-seed before install so (seed, shapeIndex) → identical board every time.
  // We hash the shape index into the seed stream so different shapes don't
  // accidentally share the same first random draws.
  RNG.set(RNG.seed);
  for (let i = 0; i < activeShapeIndex; i++) RNG.random();
  activeShape.install(scene);
  camera.position.set(0, 0, activeShape.cameraDistance);
  refreshPanels();
}

let activeShapeIndex = 0;
const SHAPES = []; // populated after all shape factories defined

// ============================================================================
//  SHAPE 1 — SUDOKU CUBE  (9×9×9 shell, digits, flip, arrow-move)
// ============================================================================
function makeCubeShape(N = 9) {
  const blockSize = Math.round(Math.sqrt(N));
  if (blockSize * blockSize !== N) throw new Error('makeCubeShape: N must be a perfect square');
  const cubeSize = 1;

  let group = null;
  let allCubes = [];
  let grid = null;
  let givenCount = 0;
  let userEntries = 0;
  let selectedCube = null;
  let highlightInner = null, highlightOuter = null;
  let _t = 0;
  let rotX = 0, rotY = 0, targetRotX = 0, targetRotY = 0;
  const DEFAULT_ZOOM = N * 3.2;
  let zoom = DEFAULT_ZOOM;

  // --- rounded box geometry (smoothed corners) ---
  function smoothCoincidentNormals(geometry, tolerance = 1e-4) {
    const positions = geometry.attributes.position.array;
    const normals = geometry.attributes.normal.array;
    const count = positions.length / 3;
    const inv = 1 / tolerance;
    const groups = new Map();
    for (let i = 0; i < count; i++) {
      const kx = Math.round(positions[i*3]   * inv);
      const ky = Math.round(positions[i*3+1] * inv);
      const kz = Math.round(positions[i*3+2] * inv);
      const key = kx + ',' + ky + ',' + kz;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(i);
    }
    for (const idxs of groups.values()) {
      if (idxs.length < 2) continue;
      let nx = 0, ny = 0, nz = 0;
      for (const i of idxs) { nx += normals[i*3]; ny += normals[i*3+1]; nz += normals[i*3+2]; }
      const len = Math.hypot(nx, ny, nz);
      if (len === 0) continue;
      nx /= len; ny /= len; nz /= len;
      for (const i of idxs) { normals[i*3] = nx; normals[i*3+1] = ny; normals[i*3+2] = nz; }
    }
    geometry.attributes.normal.needsUpdate = true;
  }

  const PLANE_OFFSET = 0.501;

  const FACE_DIRS = [
    { axis: 'x', sign: +1, normal: new THREE.Vector3( 1, 0, 0), up: new THREE.Vector3(0, 1, 0) },
    { axis: 'x', sign: -1, normal: new THREE.Vector3(-1, 0, 0), up: new THREE.Vector3(0, 1, 0) },
    { axis: 'y', sign: +1, normal: new THREE.Vector3( 0, 1, 0), up: new THREE.Vector3(0, 0, 1) },
    { axis: 'y', sign: -1, normal: new THREE.Vector3( 0,-1, 0), up: new THREE.Vector3(0, 0,-1) },
    { axis: 'z', sign: +1, normal: new THREE.Vector3( 0, 0, 1), up: new THREE.Vector3(0, 1, 0) },
    { axis: 'z', sign: -1, normal: new THREE.Vector3( 0, 0,-1), up: new THREE.Vector3(0, 1, 0) },
  ];

    const up    = new THREE.Vector3().crossVectors(f.normal, right).normalize();

    if (value === 0) return;
    for (const f of faces) {
      const pl = makeDigitPlaneForCubeFace(value, isGiven, f, !!isConflict);
      cube.add(pl);
      cube.userData.planes.push(pl);
    }

  function outerFacesFor(i, j, k) {
    const out = [];
    if (i === 0)     out.push(FACE_DIRS[1]);
    if (i === N - 1) out.push(FACE_DIRS[0]);
    if (j === 0)     out.push(FACE_DIRS[3]);
    if (j === N - 1) out.push(FACE_DIRS[2]);
    if (k === 0)     out.push(FACE_DIRS[5]);
    if (k === N - 1) out.push(FACE_DIRS[4]);

  }
  function blockColor(i, j, k) {
    const bi = Math.floor(i / blockSize), bj = Math.floor(j / blockSize), bk = Math.floor(k / blockSize);
    const hueStep = 360 / blockSize;
    const hue = 200 + bi * hueStep + bk * 14;
    const sat = 0.32 + bk * 0.09;

  // --- build ---
  const geom = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
  const edgesGeom = new THREE.EdgesGeometry(geom);
  const edgesMat = new THREE.LineBasicMaterial({ color: 0x0a0816, transparent: true, opacity: 0.65 });

  function build() {
    group = new THREE.Group();
    allCubes = [];
    grid = Array.from({length: N}, () => Array.from({length: N}, () => Array(N).fill(null)));
    givenCount = 0;
    userEntries = 0;
    rotX = rotY = targetRotX = targetRotY = 0;
    zoom = DEFAULT_ZOOM;

    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) for (let k = 0; k < N; k++) {
      const isShell = (i === 0 || i === N - 1 || j === 0 || j === N - 1 || k === 0 || k === N - 1);
      if (!isShell) continue;
      const baseColor = blockColor(i, j, k);
      const mat = new THREE.MeshStandardMaterial({ color: baseColor, metalness: 0.08, roughness: 0.42 });
      const cube = new THREE.Mesh(geom, mat);
      const p = new THREE.Vector3(gridPos(i), gridPos(j), gridPos(k));

      group.add(cube);

    // reveal each filled cell with probability GIVEN_PROBABILITY.
    const solved = Sudoku.solveCubeShell(allCubes, grid, FACE_DIRS, N, blockSize);
    for (const cube of allCubes) {
      const v = solved.get(cube) | 0;
      if (v === 0) continue;
      if (RNG.random() >= GIVEN_PROBABILITY) continue;
      cube.userData.value = v;
      cube.userData.isGiven = true;
      givenCount++;

    const hlInnerGeom = new THREE.EdgesGeometry(new THREE.BoxGeometry(cubeSize*1.06, cubeSize*1.06, cubeSize*1.06));

    highlightInner = new THREE.LineSegments(hlInnerGeom, new THREE.LineBasicMaterial({ color: 0xffe28a }));
    highlightOuter = new THREE.LineSegments(hlOuterGeom, new THREE.LineBasicMaterial({
      color: 0xffd166, transparent: true, opacity: 0.35

    highlightOuter.visible = false;

    if (!cube || cube.userData.isGiven) return;

    if (cube === selectedCube) refreshSelected();

  }
