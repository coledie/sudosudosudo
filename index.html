// ============================================================================
//  INPUT — shared across all shapes
// ============================================================================
let rotating = false, px = 0, py = 0;
let downX = 0, downY = 0, downBtn = -1;
renderer.domElement.addEventListener('mousedown', e => {
  downX = e.clientX; downY = e.clientY; downBtn = e.button;
  if (e.button === 2) { rotating = true; px = e.clientX; py = e.clientY; }
});
window.addEventListener('mousemove', e => {
  if (!rotating || !activeShape) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  if (activeShape.handleDrag) {
    activeShape.handleDrag(dx, dy);
  } else if (activeShape.install) {
    // Polyhedral shapes: rotate their root group directly via scene traversal.
    const g = scene.children.find(o => o.type === 'Group');
    if (g) { g.rotation.y += dx * 0.006; g.rotation.x += dy * 0.006; }
  }
  px = e.clientX; py = e.clientY;
});
window.addEventListener('mouseup', e => {
  if (e.button === 2) rotating = false;
  if (e.button === 0 && downBtn === 0 && activeShape) {
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.hypot(dx, dy) < 5) pickAt(e.clientX, e.clientY);
  }
  downBtn = -1;
});

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pickAt(clientX, clientY) {
  if (!activeShape) return;
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x =  ((clientX - rect.left) / rect.width)  * 2 - 1;
  ndc.y = -((clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(activeShape.pickables, false);
  activeShape.pick(hits.length > 0 ? hits[0] : null);
}

renderer.domElement.addEventListener('wheel', e => {
  if (!activeShape) return;
  if (activeShape.handleWheel) {
    activeShape.handleWheel(e.deltaY);
  } else {
    camera.position.z *= e.deltaY > 0 ? 1.08 : 1 / 1.08;
    camera.position.z = Math.max(4, Math.min(30, camera.position.z));
  }
  e.preventDefault();
}, { passive: false });

window.addEventListener('keydown', e => {
  // Shape navigation — only when active shape doesn't consume the key.
  if (e.key === '[') { switchGroup(-1); e.preventDefault(); return; }
  if (e.key === ']') { switchGroup( 1); e.preventDefault(); return; }
  if (activeShape && activeShape.keydown) activeShape.keydown(e);
  checkWin();
});

// ============================================================================
//  WIN DETECTION + CONFETTI
//  A board is considered won when every playable mesh on the active shape has
//  a non-zero value AND no piece is flagged isConflict. This works for cube
//  4/9, kilominx, kilominx 45, tuttminx, teraminx, elite kilominx, and
//  icosaminx. (Megaminx face has 11 cells over 9 digits — pigeonhole-blocked,
//  so its boards intentionally never read as "won".)
// ============================================================================
let _hasWon = false;
function isShapeSolved() {
  if (!activeShape) return false;
  const list = activeShape.pickables;
  if (!list || list.length === 0) return false;
  let any = false;
  for (const m of list) {
    const ud = m.userData; if (!ud) return false;
    if (ud.type === 'blocked') continue;
    if (!ud.value) return false;
    if (ud.isConflict) return false;
    any = true;
  }
  return any;
}
function checkWin() {
  const won = isShapeSolved();
  if (won && !_hasWon) { _hasWon = true; Confetti.burst(); }
  else if (!won) { _hasWon = false; }
}
// Reset the win latch whenever the shape changes.
const _origSwitchToShape = switchToShape;
switchToShape = function(i) { _hasWon = false; return _origSwitchToShape(i); };

const Confetti = (() => {
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const COLORS = ['#ffd166','#ef476f','#06d6a0','#118ab2','#f78c6b','#c490e4','#7fbfff'];
  const particles = [];
  let running = false;
  function tick() {
    if (!running) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const g = 0.18;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += g;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      p.life -= 1;
      if (p.life <= 0 || p.y > canvas.height + 40) { particles.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 60));
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if (particles.length > 0) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  function spawn(n, cx, cy) {
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI/2 + (Math.random() - 0.5) * Math.PI * 0.9;
      const sp = 6 + Math.random() * 10;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * sp + (Math.random() - 0.5) * 2,
        vy: Math.sin(ang) * sp,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.4,
        w: 6 + Math.random() * 6, h: 9 + Math.random() * 8,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        life: 120 + Math.random() * 60,
      });
    }
  }
  function burst() {
    spawn(180, canvas.width * 0.25, canvas.height * 0.8);
    spawn(180, canvas.width * 0.5,  canvas.height * 0.85);
    spawn(180, canvas.width * 0.75, canvas.height * 0.8);
    if (!running) { running = true; requestAnimationFrame(tick); }
    // Flash a "Solved!" banner.
    showBanner('Solved!');
  }
  return { burst };
})();

// ----- Seed UI -----
// Seed is taken from ?seed=… in the URL on first load, else random.
// Changing the seed (or pressing 🎲) rebuilds the current shape and updates
// the URL so the link can be shared / bookmarked / pre-curated.
const seedInputEl = document.getElementById('seedInput');
const seedRerollEl = document.getElementById('seedReroll');
function loadSeedFromUrl() {
  const m = (location.search.match(/[?&]seed=([^&]+)/) || [])[1];
  if (m == null) return null;
  const n = Number(decodeURIComponent(m));
  return Number.isFinite(n) ? (n >>> 0) : null;
}
function writeSeedToUrl(seed) {
  const u = new URL(location.href);
  u.searchParams.set('seed', String(seed));
  history.replaceState(null, '', u);
}
function applySeed(seed, { rebuild = true } = {}) {
  RNG.set(seed);
  seedInputEl.value = String(RNG.seed);
  writeSeedToUrl(RNG.seed);
  if (rebuild && activeShape) switchToShape(activeShapeIndex);
}
seedInputEl.addEventListener('change', () => {
  applySeed(seedInputEl.value.trim() || '1');
});
seedInputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { seedInputEl.blur(); }
  // Don't let the shape's keydown handler eat digits typed into the seed box.
  e.stopPropagation();
});
seedRerollEl.addEventListener('click', () => {
  applySeed((Math.random() * 0xFFFFFFFF) >>> 0);
});

// ============================================================================
//  RENDER LOOP
// ============================================================================
let lastT = performance.now();
(function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = (now - lastT) / 1000;
  lastT = now;
  const t = now / 1000;
  if (activeShape && activeShape.frame) activeShape.frame(dt, t);
  renderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Boot.
{
  const initial = loadSeedFromUrl();
  applySeed(initial != null ? initial : ((Math.random() * 0xFFFFFFFF) >>> 0), { rebuild: false });
}
switchToShape(0);
</script>
</body>
</html>
