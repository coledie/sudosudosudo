<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sudoku Kilominx</title>
<style>
  body {
    margin: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #1e1640 0%, #0c0a20 45%, #050410 100%);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    color: #e8e8f0;
  }
  .panel {
    position: absolute;
    padding: 12px 16px;
    background: rgba(12, 10, 24, 0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    user-select: none;
    font-size: 13px; line-height: 1.55;
  }
  #info     { top: 16px;    left: 16px; max-width: 320px; }
  #selected { bottom: 16px; left: 16px; min-width: 220px; }
  b { color: #ffd166; font-weight: 600; letter-spacing: 0.02em; }
  kbd {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 2px 7px; border-radius: 5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; color: #e8e8f0;
  }
  .dim { opacity: 0.6; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info" class="panel">
  <b>Sudoku Kilominx</b><br>
  <span class="dim">60 kite pieces tiling a dodecahedron.</span><br><br>
  <kbd>left-click</kbd> select piece &nbsp; <kbd>right-drag</kbd> rotate &nbsp; <kbd>scroll</kbd> zoom
</div>
<div id="selected" class="panel">No piece selected</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xb8c4ff, 0x2a1f3a, 0.6));
const key = new THREE.DirectionalLight(0xffe4c0, 0.9); key.position.set(8, 14, 12); scene.add(key);
const rim = new THREE.DirectionalLight(0x88a8ff, 0.5); rim.position.set(-12, -2, -8); scene.add(rim);

const baseMat = new THREE.MeshStandardMaterial({ color: 0x6a7fc8, roughness: 0.5, metalness: 0.08, flatShading: true });

// We use a DodecahedronGeometry only as a source of the 12 face positions —
// it isn't added to the scene. The visible body is built entirely from 60
// kite meshes (12 faces × 5 kites per face), all sharing ONE template
// kite geometry, each placed by its own transform.
const sourceGeom = new THREE.DodecahedronGeometry(2.5);

const dod = new THREE.Group();
scene.add(dod);

const pieces = []; // 60 kite meshes — exposed for picking/coloring
let kiteGeom = null;        // shared template kite geometry
let kiteEdges = null;       // shared kite edge geometry
let kiteHighlightGeom = null; // shrunk-inward edge loop for selection highlight

(function buildKilominxPieces() {
  // 1) Read all triangles out of the source geometry.
  const pos = sourceGeom.attributes.position;
  const triCount = pos.count / 3;
  const tris = [];
  for (let t = 0; t < triCount; t++) {
    const v0 = new THREE.Vector3().fromBufferAttribute(pos, t * 3 + 0);
    const v1 = new THREE.Vector3().fromBufferAttribute(pos, t * 3 + 1);
    const v2 = new THREE.Vector3().fromBufferAttribute(pos, t * 3 + 2);
    const n = new THREE.Vector3().subVectors(v1, v0)
                .cross(new THREE.Vector3().subVectors(v2, v0))
                .normalize();
    tris.push({ vs: [v0, v1, v2], n });
  }

  // 2) Group triangles into 12 coplanar groups (one per pentagonal face).
  const FACE_TOL = 0.01;
  const faces = [];
  for (const t of tris) {
    let f = faces.find(ff => ff.normal.dot(t.n) > 1 - FACE_TOL);
    if (!f) { f = { normal: t.n.clone(), tris: [] }; faces.push(f); }
    f.tris.push(t);
  }

  // 3) For each face, find its 5 unique vertices and sort them CCW around the face normal.
  const KEY = v => `${v.x.toFixed(4)},${v.y.toFixed(4)},${v.z.toFixed(4)}`;
  for (const f of faces) {
    const vmap = new Map();
    for (const t of f.tris) for (const v of t.vs) {
      const k = KEY(v);
      if (!vmap.has(k)) vmap.set(k, v.clone());
    }
    const verts = Array.from(vmap.values());
    const center = new THREE.Vector3();
    for (const v of verts) center.add(v);
    center.multiplyScalar(1 / verts.length);
    const u0 = new THREE.Vector3().subVectors(verts[0], center).normalize();
    const w  = new THREE.Vector3().crossVectors(f.normal, u0);
    const ang = v => {
      const r = new THREE.Vector3().subVectors(v, center);
      return Math.atan2(r.dot(w), r.dot(u0));
    };
    verts.sort((a, b) => ang(a) - ang(b));
    f.verts = verts;
    f.center = center;
  }

  // 4) Build ONE template kite in a canonical local frame:
  //      local +X = direction from face center toward the outer vertex V
  //      local +Z = outward face normal
  //      kite lies entirely in the local XY plane (z = 0)
  //    All 60 kites are congruent under the dodecahedron's symmetry group,
  //    so this single BufferGeometry is shared by all 60 meshes.
  const f0 = faces[0];
  const V0     = f0.verts[0];
  const mPrev0 = new THREE.Vector3().addVectors(f0.verts[4], f0.verts[0]).multiplyScalar(0.5);
  const mNext0 = new THREE.Vector3().addVectors(f0.verts[0], f0.verts[1]).multiplyScalar(0.5);
  const xAxis0 = new THREE.Vector3().subVectors(V0, f0.center).normalize();
  const zAxis0 = f0.normal.clone();
  const yAxis0 = new THREE.Vector3().crossVectors(zAxis0, xAxis0).normalize();
  const toLocal = p => {
    const r = new THREE.Vector3().subVectors(p, f0.center);
    return [r.dot(xAxis0), r.dot(yAxis0), r.dot(zAxis0)];
  };
  // Shrink each kite slightly toward its centroid so neighboring pieces show a thin dark seam.
  // Set to 0 to make kites tile pentagons flush with no gaps (solid look, no see-through).
  const INSET = 0;
  const Cl = [0, 0, 0];
  const mNl = toLocal(mNext0);
  const Vl  = toLocal(V0);
  const mPl = toLocal(mPrev0);
  const cx = (Cl[0] + mNl[0] + Vl[0] + mPl[0]) / 4;
  const cy = (Cl[1] + mNl[1] + Vl[1] + mPl[1]) / 4;
  const shrink = (p) => {
    const dx = p[0] - cx, dy = p[1] - cy;
    const d  = Math.hypot(dx, dy) || 1;
    const k  = Math.max(0, 1 - INSET / d);
    return [cx + dx * k, cy + dy * k, p[2]];
  };
  const C2 = shrink(Cl), N2 = shrink(mNl), V2 = shrink(Vl), P2 = shrink(mPl);

  kiteGeom = new THREE.BufferGeometry();
  kiteGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    C2[0], C2[1], C2[2],   // 0: center
    N2[0], N2[1], N2[2],   // 1: mNext (CCW from C looking down +Z)
    V2[0], V2[1], V2[2],   // 2: outer vertex
    P2[0], P2[1], P2[2],   // 3: mPrev
  ]), 3));
  kiteGeom.setIndex([0, 2, 1, 0, 3, 2]);
  kiteGeom.computeVertexNormals();
  kiteEdges = new THREE.EdgesGeometry(kiteGeom);

  // Build a thicker outline as 4 thin quad strips along the kite's 4 edges,
  // lifted slightly above the kite surface. WebGL ignores LineBasicMaterial.linewidth,
  // so we use real triangles to get a controllable visual thickness.
  const EDGE_HALF_W = 0.022;     // total stripe width = 2 * EDGE_HALF_W
  const EDGE_LIFT   = 0.004;     // lift above surface to avoid z-fighting
  const edgePts = [ [0,0], [N2[0],N2[1]], [V2[0],V2[1]], [P2[0],P2[1]] ];  // C, N, V, P
  const stripPos = [];
  const stripIdx = [];
  let svi = 0;
  for (let i = 0; i < 4; i++) {
    const a = edgePts[i], b = edgePts[(i + 1) % 4];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len * EDGE_HALF_W;
    const ny =  dx / len * EDGE_HALF_W;
    stripPos.push(
      a[0] + nx, a[1] + ny, EDGE_LIFT,
      a[0] - nx, a[1] - ny, EDGE_LIFT,
      b[0] + nx, b[1] + ny, EDGE_LIFT,
      b[0] - nx, b[1] - ny, EDGE_LIFT,
    );
    stripIdx.push(svi, svi + 1, svi + 2,  svi + 1, svi + 3, svi + 2);
    svi += 4;
  }
  const kiteOutlineGeom = new THREE.BufferGeometry();
  kiteOutlineGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(stripPos), 3));
  kiteOutlineGeom.setIndex(stripIdx);

  // Highlight outline: same kite edge loop shrunk slightly toward the kite's own centroid,
  // and lifted in +Z so it sits cleanly inside each kite's dark border.
  const SHRINK = 0.07;       // 7% inward toward the centroid
  const HL_LIFT = 0.008;
  const ccx = (N2[0] + V2[0] + P2[0]) / 4; // centroid of (C=origin, N, V, P)
  const ccy = (N2[1] + V2[1] + P2[1]) / 4;
  const shrinkToCentroid = (px, py) => [
    ccx + (px - ccx) * (1 - SHRINK),
    ccy + (py - ccy) * (1 - SHRINK),
  ];
  const Cs = shrinkToCentroid(0, 0);
  const Ns = shrinkToCentroid(N2[0], N2[1]);
  const Vs = shrinkToCentroid(V2[0], V2[1]);
  const Ps = shrinkToCentroid(P2[0], P2[1]);
  kiteHighlightGeom = new THREE.BufferGeometry();
  kiteHighlightGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    Cs[0], Cs[1], HL_LIFT,  Ns[0], Ns[1], HL_LIFT,
    Ns[0], Ns[1], HL_LIFT,  Vs[0], Vs[1], HL_LIFT,
    Vs[0], Vs[1], HL_LIFT,  Ps[0], Ps[1], HL_LIFT,
    Ps[0], Ps[1], HL_LIFT,  Cs[0], Cs[1], HL_LIFT,
  ]), 3));

  // 5) Place 60 instances. Each (face f, slot i) gets its own world transform:
  //      basis = [ (V_i - C).normalized, normal × xAxis, normal ] , origin = C
  const outlineMat = new THREE.MeshBasicMaterial({
    color: 0x07060f, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
  });
  for (const f of faces) {
    for (let i = 0; i < 5; i++) {
      const C = f.center;
      const V = f.verts[i];
      const xA = new THREE.Vector3().subVectors(V, C).normalize();
      const zA = f.normal.clone();
      const yA = new THREE.Vector3().crossVectors(zA, xA).normalize();
      const M  = new THREE.Matrix4().makeBasis(xA, yA, zA).setPosition(C);

      // Each piece gets its own material clone so we can set emissive per-piece on selection.
      const piece = new THREE.Mesh(kiteGeom, baseMat.clone());
      piece.applyMatrix4(M);
      piece.userData = {
        face: faces.indexOf(f),
        slot: i,
        index: pieces.length,
        outerVertex: V.clone(),
      };
      const outlineMesh = new THREE.Mesh(kiteOutlineGeom, outlineMat);
      outlineMesh.renderOrder = 1;
      piece.add(outlineMesh);
      dod.add(piece);
      pieces.push(piece);
    }
  }

  // 6) Group the 60 kites into 20 corner pieces (3 kites per dodec vertex).
  const cornerByKey = new Map();
  for (const p of pieces) {
    const k = KEY(p.userData.outerVertex);
    if (!cornerByKey.has(k)) cornerByKey.set(k, []);
    cornerByKey.get(k).push(p);
  }
  let cornerIdx = 0;
  for (const members of cornerByKey.values()) {
    for (const p of members) {
      p.userData.corner = cornerIdx;
      p.userData.siblings = members;
    }
    cornerIdx++;
  }
})();

// --- selection: a corner = 3 kite meshes meeting at a dodec vertex ---
const highlightMat = new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.95 });

let selectedCorner = null;  // array of 3 kite meshes, or null
const selInfoEl = document.getElementById('selected');

function updateInfo() {
  if (!selectedCorner) { selInfoEl.textContent = 'No piece selected'; return; }
  const cornerIdx = selectedCorner[0].userData.corner;
  const faces = selectedCorner.map(m => m.userData.face + 1).sort((a, b) => a - b);
  selInfoEl.innerHTML =
    `<b>Selected corner</b><br>` +
    `<span class="dim">Corner</span> ${cornerIdx + 1} <span class="dim">/ 20</span><br>` +
    `<span class="dim">Touches faces</span> ${faces.join(', ')}`;
}

function selectPiece(piece) {
  if (selectedCorner) {
    for (const m of selectedCorner) {
      m.material.emissive.setHex(0x000000);
      m.material.emissiveIntensity = 1;
      if (m.userData.highlight) {
        m.remove(m.userData.highlight);
        m.userData.highlight = null;
      }
    }
  }
  selectedCorner = piece ? piece.userData.siblings : null;
  if (selectedCorner) {
    for (const m of selectedCorner) {
      m.material.emissive = new THREE.Color(0xffd166);
      m.material.emissiveIntensity = 0.25;
      const hl = new THREE.LineSegments(kiteHighlightGeom, highlightMat);
      hl.renderOrder = 2;
      m.add(hl);
      m.userData.highlight = hl;
    }
  }
  updateInfo();
}

// --- input: right-drag rotates; left-click (without drag) picks a piece ---
let rotating = false, px = 0, py = 0;
let downX = 0, downY = 0, downBtn = -1;
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
renderer.domElement.addEventListener('mousedown', e => {
  downX = e.clientX; downY = e.clientY; downBtn = e.button;
  if (e.button === 2) { rotating = true; px = e.clientX; py = e.clientY; }
});
window.addEventListener('mousemove', e => {
  if (!rotating) return;
  dod.rotation.y += (e.clientX - px) * 0.006;
  dod.rotation.x += (e.clientY - py) * 0.006;
  px = e.clientX; py = e.clientY;
});
window.addEventListener('mouseup', e => {
  if (e.button === 2) rotating = false;
  if (e.button === 0 && downBtn === 0) {
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.hypot(dx, dy) < 5) pickAt(e.clientX, e.clientY);
  }
  downBtn = -1;
});

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pickAt(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x =  ((clientX - rect.left) / rect.width)  * 2 - 1;
  ndc.y = -((clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pieces, false);
  selectPiece(hits.length > 0 ? hits[0].object : null);
}

renderer.domElement.addEventListener('wheel', e => {
  camera.position.z *= e.deltaY > 0 ? 1.08 : 1 / 1.08;
  camera.position.z = Math.max(4, Math.min(30, camera.position.z));
  e.preventDefault();
}, { passive: false });

(function loop() {
  requestAnimationFrame(loop);
  renderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
