<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sudoku Cube</title>
<style>
  body {
    margin: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #1e1640 0%, #0c0a20 45%, #050410 100%);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    color: #e8e8f0;
  }
  .panel {
    position: absolute;
    padding: 12px 16px;
    background: rgba(12, 10, 24, 0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    user-select: none;
    font-size: 13px; line-height: 1.55;
  }
  #info { top: 16px; left: 16px; max-width: 340px; }
  #selected { bottom: 16px; left: 16px; min-width: 240px; }
  #stats { top: 16px; right: 16px; text-align: right; }
  b { color: #ffd166; font-weight: 600; letter-spacing: 0.02em; }
  kbd {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 2px 7px; border-radius: 5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: #e8e8f0;
  }
  .dim { opacity: 0.6; }
  .given { color: #ffd166; }
  .user  { color: #7fbfff; }
  .stat-num { font-size: 18px; font-weight: 600; color: #ffd166; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info" class="panel">
  <b>Sudoku Cube</b><br>
  <span class="dim">A 729-cell puzzle living in three dimensions.</span><br><br>
  <kbd>left-click</kbd> select &nbsp; <kbd>1</kbd>–<kbd>9</kbd> fill &nbsp; <kbd>0</kbd>/<kbd>⌫</kbd> clear<br>
  <kbd>right-drag</kbd> rotate &nbsp; <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> flip face<br>
  <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> move selected &nbsp; <kbd>⇧</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> Z-axis<br>
  <kbd>scroll</kbd> zoom
</div>
<div id="stats" class="panel">
  <span class="dim">cells</span> <span class="stat-num" id="stat-cells">729</span><br>
  <span class="dim">sub-blocks</span> <span class="stat-num" id="stat-blocks">27</span><br>
  <span class="dim">given clues</span> <span class="stat-num" id="stat-given">—</span><br>
  <span class="dim">your entries</span> <span class="stat-num" id="stat-user">0</span>
</div>
<div id="selected" class="panel">No cube selected</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// --- scene ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// --- lighting ---
const hemi = new THREE.HemisphereLight(0xb8c4ff, 0x2a1f3a, 0.55);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffe4c0, 0.9);
keyLight.position.set(8, 14, 12);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x88a8ff, 0.6);
rimLight.position.set(-12, -2, -8);
scene.add(rimLight);
const fillLight = new THREE.DirectionalLight(0xffb8d0, 0.25);
fillLight.position.set(4, -10, 6);
scene.add(fillLight);

// --- rounded box geometry --------------------------------------------------
// Start from a subdivided BoxGeometry, push each vertex outward from the
// inner "core box" so corners and edges become spheres/cylinders, then
// average normals across coincident vertices to get smooth bevels.
function smoothCoincidentNormals(geometry, tolerance = 1e-4) {
  const positions = geometry.attributes.position.array;
  const normals = geometry.attributes.normal.array;
  const count = positions.length / 3;
  const inv = 1 / tolerance;
  const groups = new Map();
  for (let i = 0; i < count; i++) {
    const kx = Math.round(positions[i*3]   * inv);
    const ky = Math.round(positions[i*3+1] * inv);
    const kz = Math.round(positions[i*3+2] * inv);
    const key = kx + ',' + ky + ',' + kz;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  }
  for (const idxs of groups.values()) {
    if (idxs.length < 2) continue;
    let nx = 0, ny = 0, nz = 0;
    for (const i of idxs) { nx += normals[i*3]; ny += normals[i*3+1]; nz += normals[i*3+2]; }
    const len = Math.hypot(nx, ny, nz);
    if (len === 0) continue;
    nx /= len; ny /= len; nz /= len;
    for (const i of idxs) { normals[i*3] = nx; normals[i*3+1] = ny; normals[i*3+2] = nz; }
  }
  geometry.attributes.normal.needsUpdate = true;
}

function makeRoundedBox(size, radius, segments = 4) {
  const geo = new THREE.BoxGeometry(size, size, size, segments, segments, segments);
  const pos = geo.attributes.position;
  const innerHalf = size / 2 - radius;
  const v = new THREE.Vector3();
  const inner = new THREE.Vector3();
  const dir = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    inner.set(
      Math.max(-innerHalf, Math.min(innerHalf, v.x)),
      Math.max(-innerHalf, Math.min(innerHalf, v.y)),
      Math.max(-innerHalf, Math.min(innerHalf, v.z))
    );
    dir.subVectors(v, inner);
    const len = dir.length();
    if (len > 1e-6) {
      dir.multiplyScalar(radius / len);
      pos.setXYZ(i, inner.x + dir.x, inner.y + dir.y, inner.z + dir.z);
    }
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  smoothCoincidentNormals(geo);
  return geo;
}

// --- number textures (canvas) ---
function makeNumberTexture(num, color) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#fafafa';
  g.fillRect(0, 0, 128, 128);
  if (num) {
    g.shadowColor = 'rgba(20, 15, 40, 0.25)';
    g.shadowBlur = 5;
    g.shadowOffsetY = 2;
    g.fillStyle = color;
    g.font = '700 90px "SF Pro Display", -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(String(num), 64, 70);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
const blankTexture = makeNumberTexture(0, '');
const givenTextures = {}, userTextures = {};
for (let n = 1; n <= 9; n++) {
  givenTextures[n] = makeNumberTexture(n, '#1a1230');
  userTextures[n]  = makeNumberTexture(n, '#1d4d9c');
}

// --- palette: 27 jewel tones across cool→warm spectrum ---
function blockColor(i, j, k) {
  const bi = Math.floor(i / 3), bj = Math.floor(j / 3), bk = Math.floor(k / 3);
  const hueBases = [200, 258, 318];
  const hue = hueBases[bi] + bk * 14;
  const sat = 0.32 + bk * 0.09;
  const lit = 0.55 + (bj - 1) * 0.07;
  return new THREE.Color().setHSL(((hue % 360) + 360) % 360 / 360, sat, lit);
}

// --- build cube ---
const cubeGroup = new THREE.Group();
const N = 9;
const cubeSize = 1;
const gap = 0.06;
const blockGap = 0.35;

const total = N * cubeSize + (N - 1) * gap + 2 * blockGap;
const start = -total / 2 + cubeSize / 2;
function gridPos(i) {
  return start + i * (cubeSize + gap) + Math.floor(i / 3) * blockGap;
}

// shared rounded geometry → 729 cubes reuse the same vertex buffer
const geom = makeRoundedBox(cubeSize, 0.12, 4);

const grid = Array.from({length: N}, () => Array.from({length: N}, () => Array(N).fill(null)));
const allCubes = [];

const GIVEN_PROBABILITY = 0.30;
let givenCount = 0;

for (let i = 0; i < N; i++) {
  for (let j = 0; j < N; j++) {
    for (let k = 0; k < N; k++) {
      const baseColor = blockColor(i, j, k);
      const isGiven = Math.random() < GIVEN_PROBABILITY;
      const value   = isGiven ? Math.floor(Math.random() * 9) + 1 : 0;
      if (isGiven) givenCount++;
      const texture = isGiven ? givenTextures[value] : blankTexture;

      const mat = new THREE.MeshStandardMaterial({
        color: baseColor,
        map: texture,
        metalness: 0.08,
        roughness: 0.42,
      });

      const cube = new THREE.Mesh(geom, mat);
      const p = new THREE.Vector3(gridPos(i), gridPos(j), gridPos(k));
      cube.position.copy(p);
      cube.userData = { i, j, k, targetPos: p.clone(), isGiven, value };
      cubeGroup.add(cube);
      allCubes.push(cube);
      grid[i][j][k] = cube;
    }
  }
}
scene.add(cubeGroup);
document.getElementById('stat-given').textContent = givenCount;

// --- highlight: layered outlines around the selected cube ---
const hlInnerGeom = new THREE.EdgesGeometry(new THREE.BoxGeometry(cubeSize*1.06, cubeSize*1.06, cubeSize*1.06));
const hlOuterGeom = new THREE.EdgesGeometry(new THREE.BoxGeometry(cubeSize*1.18, cubeSize*1.18, cubeSize*1.18));
const highlightInner = new THREE.LineSegments(hlInnerGeom, new THREE.LineBasicMaterial({ color: 0xffe28a }));
const highlightOuter = new THREE.LineSegments(hlOuterGeom, new THREE.LineBasicMaterial({
  color: 0xffd166, transparent: true, opacity: 0.35
}));
highlightInner.visible = false;
highlightOuter.visible = false;
cubeGroup.add(highlightInner);
cubeGroup.add(highlightOuter);

// --- selection / info ---
let selectedCube = null;
let userEntries = 0;
const infoEl = document.getElementById('selected');
const statUserEl = document.getElementById('stat-user');

function updateInfo() {
  if (!selectedCube) { infoEl.textContent = 'No cube selected'; return; }
  const { i, j, k, isGiven, value } = selectedCube.userData;
  const block = `(${Math.floor(i/3)+1}, ${Math.floor(j/3)+1}, ${Math.floor(k/3)+1})`;
  let v;
  if (value === 0)        v = '<span class="dim">empty</span>';
  else if (isGiven)       v = `<span class="given">${value}</span> <span class="dim">(given)</span>`;
  else                    v = `<span class="user">${value}</span>`;
  infoEl.innerHTML =
    `<b>Selected cell</b><br>` +
    `<span class="dim">Cell</span> (${i+1}, ${j+1}, ${k+1})<br>` +
    `<span class="dim">Sub-block</span> ${block}<br>` +
    `<span class="dim">Value</span> ${v}`;
}

function selectCube(cube) {
  if (selectedCube && selectedCube.material.emissive) {
    selectedCube.material.emissive.setHex(0x000000);
    selectedCube.material.emissiveIntensity = 1;
  }
  selectedCube = cube;
  if (cube) {
    cube.material.emissive = new THREE.Color(0xffd166);
    cube.material.emissiveIntensity = 0.2;
    highlightInner.visible = true;
    highlightOuter.visible = true;
  } else {
    highlightInner.visible = false;
    highlightOuter.visible = false;
  }
  updateInfo();
}

function setCellValue(cube, value) {
  if (!cube || cube.userData.isGiven) return;
  const prev = cube.userData.value;
  cube.userData.value = value;
  cube.material.map = value === 0 ? blankTexture : userTextures[value];
  cube.material.needsUpdate = true;
  if (prev === 0 && value !== 0) userEntries++;
  else if (prev !== 0 && value === 0) userEntries--;
  statUserEl.textContent = userEntries;
  if (cube === selectedCube) updateInfo();
}

// --- rotation / zoom ---
let rotX = 0, rotY = 0;
let targetRotX = 0, targetRotY = 0;
let zoom = 28;

// --- mouse ---
let rotating = false, px = 0, py = 0;
let downX = 0, downY = 0, downBtn = -1;
renderer.domElement.addEventListener('mousedown', e => {
  downX = e.clientX; downY = e.clientY; downBtn = e.button;
  if (e.button === 2) { rotating = true; px = e.clientX; py = e.clientY; }
});
window.addEventListener('mousemove', e => {
  if (!rotating) return;
  rotY += (e.clientX - px) * 0.006;
  rotX += (e.clientY - py) * 0.006;
  targetRotX = rotX; targetRotY = rotY;
  px = e.clientX; py = e.clientY;
});
window.addEventListener('mouseup', e => {
  rotating = false;
  if (e.button === 0 && downBtn === 0) {
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.hypot(dx, dy) < 5) pickAt(e.clientX, e.clientY);
  }
  downBtn = -1;
});

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pickAt(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x =  ((clientX - rect.left) / rect.width)  * 2 - 1;
  ndc.y = -((clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(allCubes, false);
  selectCube(hits.length > 0 ? hits[0].object : null);
}

// touch
let touching = false, tpx = 0, tpy = 0, tDownX = 0, tDownY = 0, tMoved = false;
renderer.domElement.addEventListener('touchstart', e => {
  touching = true; tMoved = false;
  tpx = e.touches[0].clientX; tpy = e.touches[0].clientY;
  tDownX = tpx; tDownY = tpy;
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (!touching) return;
  const x = e.touches[0].clientX, y = e.touches[0].clientY;
  if (Math.hypot(x - tDownX, y - tDownY) > 5) tMoved = true;
  if (tMoved) {
    rotY += (x - tpx) * 0.006;
    rotX += (y - tpy) * 0.006;
    targetRotX = rotX; targetRotY = rotY;
  }
  tpx = x; tpy = y;
}, { passive: true });
window.addEventListener('touchend', () => {
  touching = false;
  if (!tMoved) pickAt(tDownX, tDownY);
});

window.addEventListener('wheel', e => {
  zoom = Math.max(10, Math.min(70, zoom + e.deltaY * 0.02));
}, { passive: true });

// --- WASD flip & arrow move ---
function flip(axis, dir) {
  const snap = v => Math.round(v / (Math.PI/2)) * (Math.PI/2);
  if (axis === 'x') targetRotX = snap(targetRotX) + dir * Math.PI/2;
  else              targetRotY = snap(targetRotY) + dir * Math.PI/2;
}

const _tmpQuat = new THREE.Quaternion();
const _tmpEuler = new THREE.Euler();
function arrowMove(sx, sy, sz) {
  if (!selectedCube) return;
  _tmpEuler.set(targetRotX, targetRotY, 0, 'XYZ');
  _tmpQuat.setFromEuler(_tmpEuler).invert();
  const localDir = new THREE.Vector3(sx, sy, sz).applyQuaternion(_tmpQuat);
  const ax = Math.abs(localDir.x), ay = Math.abs(localDir.y), az = Math.abs(localDir.z);
  let di = 0, dj = 0, dk = 0;
  if (ax >= ay && ax >= az)      di = Math.sign(localDir.x);
  else if (ay >= az)             dj = Math.sign(localDir.y);
  else                           dk = Math.sign(localDir.z);
  moveSelected(di, dj, dk);
}

function moveSelected(di, dj, dk) {
  if (!selectedCube || (di === 0 && dj === 0 && dk === 0)) return;
  const { i, j, k } = selectedCube.userData;
  const ni = i + di, nj = j + dj, nk = k + dk;
  if (ni < 0 || ni >= N || nj < 0 || nj >= N || nk < 0 || nk >= N) return;
  const other = grid[ni][nj][nk];
  grid[i][j][k] = other;
  grid[ni][nj][nk] = selectedCube;
  other.userData.i = i; other.userData.j = j; other.userData.k = k;
  selectedCube.userData.i = ni; selectedCube.userData.j = nj; selectedCube.userData.k = nk;
  selectedCube.userData.targetPos = new THREE.Vector3(gridPos(ni), gridPos(nj), gridPos(nk));
  other.userData.targetPos        = new THREE.Vector3(gridPos(i),  gridPos(j),  gridPos(k));
  updateInfo();
}

window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'w' || k === 'W') { flip('x', -1); e.preventDefault(); return; }
  if (k === 's' || k === 'S') { flip('x',  1); e.preventDefault(); return; }
  if (k === 'a' || k === 'A') { flip('y', -1); e.preventDefault(); return; }
  if (k === 'd' || k === 'D') { flip('y',  1); e.preventDefault(); return; }
  if (k === 'ArrowUp')    { e.shiftKey ? arrowMove(0, 0, -1) : arrowMove(0,  1, 0); e.preventDefault(); return; }
  if (k === 'ArrowDown')  { e.shiftKey ? arrowMove(0, 0,  1) : arrowMove(0, -1, 0); e.preventDefault(); return; }
  if (k === 'ArrowLeft')  { arrowMove(-1, 0, 0); e.preventDefault(); return; }
  if (k === 'ArrowRight') { arrowMove( 1, 0, 0); e.preventDefault(); return; }
  if (k >= '1' && k <= '9') { setCellValue(selectedCube, parseInt(k)); e.preventDefault(); return; }
  if (k === '0' || k === 'Backspace' || k === 'Delete') { setCellValue(selectedCube, 0); e.preventDefault(); return; }
});

// --- animate ---
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.016;
  rotX += (targetRotX - rotX) * 0.18;
  rotY += (targetRotY - rotY) * 0.18;
  cubeGroup.rotation.x = rotX;
  cubeGroup.rotation.y = rotY;

  for (const c of allCubes) c.position.lerp(c.userData.targetPos, 0.2);
  if (selectedCube) {
    highlightInner.position.copy(selectedCube.position);
    highlightOuter.position.copy(selectedCube.position);
    highlightOuter.material.opacity = 0.25 + 0.15 * Math.sin(t * 3);
  }

  camera.position.set(0, 0, zoom);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
